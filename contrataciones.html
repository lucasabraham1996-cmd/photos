function teamInitials(name){return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function teamLogoHtml(team,cls='team-option-crest'){const src=team&&team.logo?esc(team.logo):'';const initials=teamInitials(team&&team.name);return `<span class="${cls}"><span class="team-crest-fallback">${esc(initials)}</span>${src?`<img src="${src}" alt="Escudo ${esc(team.name)}" loading="lazy" onerror="this.style.display='none'">`:''}</span>`}
function teamPickerMarkup(field,label,selected=''){
  const current=LCF_TEAMS.find(t=>t.name.toLocaleLowerCase('es-AR')===String(selected||'').trim().toLocaleLowerCase('es-AR'))||null;
  const other=Boolean(selected&&!current);
  const options=[...LCF_TEAMS].sort((a,b)=>a.name.localeCompare(b.name,'es-AR')).map(t=>`<button type="button" class="team-option" data-team-name="${esc(t.name)}" data-team-logo="${esc(t.logo||'')}">${teamLogoHtml(t)}<span><b>${esc(t.name)}</b></span></button>`).join('');
  const display=current?current.name:(other?titleWords(selected):'Elegí un equipo');
  const team=current||{name:display,logo:''};
  return `<div class="field team-field ${field==='away'?'away-picker':''}" data-team-picker="${field}"><label>${label}</label><input type="hidden" name="${field}" value="${esc(selected||'')}"><button type="button" class="team-picker-trigger" aria-expanded="false">${teamLogoHtml(team,'team-picker-crest')}<span class="team-picker-copy"><b>${esc(display)}</b><small>${current?'Liga Cordobesa':'Buscá o elegí un equipo'}</small></span><span class="team-picker-chevron">⌄</span></button><div class="team-picker-menu hidden"><input type="search" class="team-picker-search" placeholder="Buscar equipo…" autocomplete="off"><div class="team-picker-options">${options}<button type="button" class="team-option other-team" data-team-name="__other__"><span class="team-option-crest"><span class="team-crest-fallback">+</span></span><span><b>Otro equipo</b><small>Escribir manualmente</small></span></button><div class="team-picker-empty hidden">No encontré equipos con ese nombre.</div></div></div><input class="input team-other-input ${other?'':'hidden'}" data-team-other="${field}" placeholder="Escribí el nombre del equipo" value="${other?esc(titleWords(selected)):''}"></div>`;
}
function setTeamPicker(root,name,division='',logo=''){
  const hidden=root.querySelector('input[type="hidden"]'); const copy=root.querySelector('.team-picker-copy'); const crest=root.querySelector('.team-picker-crest'); const other=root.querySelector('.team-other-input');
  hidden.value=name||''; copy.querySelector('b').textContent=name||'Elegí un equipo'; copy.querySelector('small').textContent=name?'Liga Cordobesa':'Buscá o elegí un equipo';
  crest.innerHTML=`<span class="team-crest-fallback">${teamInitials(name||'?')}</span>${logo?`<img src="${logo}" alt="Escudo ${esc(name)}" onerror="this.style.display='none'">`:''}`;
  if(name!=='__other__') other.classList.add('hidden');
}
function initTeamPickers(){
  const roots=[...document.querySelectorAll('[data-team-picker]')];
  const closeAll=except=>roots.forEach(r=>{if(r!==except){r.querySelector('.team-picker-menu').classList.add('hidden');r.querySelector('.team-picker-trigger').classList.remove('open');r.querySelector('.team-picker-trigger').setAttribute('aria-expanded','false')}});
  roots.forEach(root=>{
    const trigger=root.querySelector('.team-picker-trigger'),menu=root.querySelector('.team-picker-menu'),search=root.querySelector('.team-picker-search'),hidden=root.querySelector('input[type="hidden"]'),other=root.querySelector('.team-other-input');
    trigger.onclick=e=>{e.stopPropagation();const opening=menu.classList.contains('hidden');closeAll(root);menu.classList.toggle('hidden',!opening);trigger.classList.toggle('open',opening);trigger.setAttribute('aria-expanded',String(opening));if(opening)setTimeout(()=>search.focus(),30)};
    root.querySelectorAll('.team-option').forEach(btn=>btn.onclick=()=>{const name=btn.dataset.teamName;if(name==='__other__'){hidden.value=other.value||'';setTeamPicker(root,titleWords(other.value)||'Otro equipo','Otro equipo','');other.classList.remove('hidden');setTimeout(()=>other.focus(),30)}else{setTeamPicker(root,name,'',btn.dataset.teamLogo||'')}menu.classList.add('hidden');trigger.classList.remove('open');trigger.setAttribute('aria-expanded','false')});
    other.oninput=()=>{hidden.value=titleWords(other.value);root.querySelector('.team-picker-copy b').textContent=hidden.value||'Otro equipo'};
    other.onblur=()=>{other.value=titleWords(other.value);hidden.value=other.value};
    search.oninput=()=>{const q=search.value.trim().toLocaleLowerCase('es-AR');let visible=0;root.querySelectorAll('.team-option:not(.other-team)').forEach(btn=>{const ok=!q||btn.dataset.teamName.toLocaleLowerCase('es-AR').includes(q);btn.classList.toggle('hidden',!ok);if(ok)visible++});root.querySelectorAll('.team-picker-group').forEach(g=>{let n=g.nextElementSibling,has=false;while(n&&!n.classList.contains('team-picker-group')&&!n.classList.contains('other-team')){if(n.classList.contains('team-option')&&!n.classList.contains('hidden'))has=true;n=n.nextElementSibling}g.classList.toggle('hidden',!has)});root.querySelector('.team-picker-empty').classList.toggle('hidden',visible>0)};
  });
  document.addEventListener('click',()=>closeAll(null),{once:true});
}

async function initFirebase(){try{firebase.initializeApp(FIREBASE_CONFIG);if(firebase.auth&&!firebase.auth().currentUser)await firebase.auth().signInAnonymously().catch(()=>null);db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true})}catch(e){}return true}catch(e){console.error(e);return false}}

async function createDraft(data){const id=uid();const clean={id,type:'booking',status:'pendiente',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),payment:Number(data.payment||0),adminNote:data.adminNote||'',date:'',home:'',away:'',category:'',venue:'',address:'',matchTime:'',arrivalTime:'',clientName:'',phone:'',notes:''};await bookingDoc(id).set(clean);return clean}
async function loadOne(id){const s=await bookingDoc(id).get();return s.exists?{id:s.id,...s.data()}:null}

function bookingDateMs(b){if(!b||!b.date)return NaN;const t=b.matchTime||b.arrivalTime||'12:00';const ms=Date.parse(`${b.date}T${t}:00`);return Number.isFinite(ms)?ms:NaN}
async function purgeExpiredBookings(items){const cutoff=Date.now()-10*24*60*60*1000;const expired=(items||[]).filter(b=>{const ms=bookingDateMs(b);return Number.isFinite(ms)&&ms<cutoff});if(!expired.length)return items||[];await Promise.allSettled(expired.map(b=>bookingDoc(b.id).delete()));const gone=new Set(expired.map(b=>b.id));return (items||[]).filter(b=>!gone.has(b.id))}
async function listBookings(){const snap=await db.collection(BOOKINGS_PATH).limit(500).get();let items=snap.docs.map(d=>({id:d.id,...d.data()}));items=await purgeExpiredBookings(items);return items.sort((a,b)=>{const am=bookingDateMs(a),bm=bookingDateMs(b);if(Number.isFinite(am)&&Number.isFinite(bm)&&bm!==am)return bm-am;if(Number.isFinite(bm)&&!Number.isFinite(am))return 1;if(Number.isFinite(am)&&!Number.isFinite(bm))return -1;return String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))})}
function publicForm(b){currentDraft=b;document.title=`${b.id} · Contratación`;$('#app').innerHTML=appShell(`<div class="grid"><section class="card hero"><div class="eyebrow">Cobertura deportiva</div><h2 class="title">Coordinemos el partido.</h2><p class="copy">Completá los datos de la cobertura. El valor ya fue acordado previamente con Lucas y no puede modificarse desde este formulario.</p><div class="divider"></div><div class="money">${money(b.payment)}</div><div class="muted">Pago acordado</div><div class="calendar-note" style="margin-top:18px"><b>Importante:</b> indicá la categoría, la cancha y una dirección lo más completa posible. Así Lucas puede organizar la cobertura y abrir la ubicación directamente en Maps.</div></section><section class="card"><h3 class="section-title">Datos del partido</h3><form id="clientForm" class="formgrid"><div class="field"><label>Fecha del partido</label><input required class="input" type="date" name="date" value="${esc(b.date)}"></div><div class="field"><label>Horario del partido</label><input required class="input" type="time" name="matchTime" value="${esc(b.matchTime)}"></div>${teamPickerMarkup('home','Equipo local',b.home)}${teamPickerMarkup('away','Equipo visitante',b.away)}<div class="field"><label>Categoría</label><select required class="input" name="category">${categoryOptions(b.category)}</select></div><div class="field"><label>Cancha / estadio</label><input required class="input" name="venue" placeholder="Ej: Héroes de Malvinas" value="${esc(b.venue)}"></div><div class="field full"><label>Dirección</label><input required class="input" name="address" placeholder="Ej: Av. X 1234, Córdoba" value="${esc(b.address)}"></div><div class="field"><label>Hora de llegada del fotógrafo</label><input required class="input" type="time" name="arrivalTime" value="${esc(b.arrivalTime)}"></div><div class="field"><label>Pago acordado</label><input class="input" readonly value="${money(b.payment)}"></div><div class="field"><label>Tu nombre</label><input required class="input" name="clientName" placeholder="Nombre y apellido" value="${esc(b.clientName)}"></div><div class="field"><label>WhatsApp / teléfono</label><input required class="input" name="phone" placeholder="351..." value="${esc(b.phone)}"></div><div class="field full"><label>Observaciones</label><textarea class="input" rows="3" name="notes" placeholder="Referencia de ingreso, indicaciones especiales, etc.">${esc(b.notes)}</textarea></div><div class="field full"><button class="btn green" type="submit">✓ Confirmar contratación</button><div id="msg"></div></div></form></section></div>`,`<span class="pill">Solicitud ${esc(b.id)}</span>`);initTeamPickers();$('#clientForm').onsubmit=submitClient}
async function submitClient(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());data.home=titleWords(data.home);data.away=titleWords(data.away);const msg=$('#msg');if(!data.home||!data.away){msg.innerHTML='<div class="notice err">Elegí el equipo local y el visitante. Si no aparece, usá “Otro equipo”.</div>';return}msg.innerHTML='<div class="notice info">Guardando confirmación…</div>';try{await saveBooking(currentDraft.id,{...data,status:'confirmado',confirmedAt:new Date().toISOString()});renderSuccess({...currentDraft,...data,status:'confirmado'})}catch(err){msg.innerHTML='<div class="notice err">No pude guardar la confirmación. Revisá tu conexión y volvé a intentar.</div>'}}

function login(){$('#app').innerHTML=`<div class="login"><div class="card"><div class="logo"><img src="${LOGO}"></div><div class="eyebrow">Acceso admin</div><h2 style="font-size:28px;margin:9px 0 8px">Agenda de coberturas</h2><p class="copy">Ingresá el PIN del panel.</p><form id="loginForm" style="margin-top:18px"><input id="pin" class="input" type="password" inputmode="numeric" placeholder="PIN" style="text-align:center;font-size:22px;letter-spacing:.2em"><button class="btn primary" style="width:100%;margin-top:10px">Entrar</button><div id="loginMsg"></div></form></div></div>`;$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#pin').value===ADMIN_PIN){sessionStorage.setItem('la_booking_admin','1');adminUnlocked=true;adminPage()}else $('#loginMsg').innerHTML='<div class="notice err">PIN incorrecto.</div>'}}

async function renderAdminList(filter=''){const body=$('#adminBody');try{const all=await listBookings();const q=filter.toLowerCase().trim();const list=q?all.filter(b=>[b.home,b.away,b.category,b.venue,b.address,b.clientName,b.phone,b.id,b.status].join(' ').toLowerCase().includes(q)):all;const upcoming=all.filter(b=>b.status!=='cancelado'&&b.date&&b.date>=new Date().toISOString().slice(0,10));const confirmed=all.filter(b=>b.status==='confirmado').length;const total=upcoming.reduce((s,b)=>s+Number(b.payment||0),0);body.innerHTML=`<div class="stats"><div class="stat"><b>${upcoming.length}</b><span>Próximas</span></div><div class="stat"><b>${confirmed}</b><span>Confirmadas</span></div><div class="stat"><b>${all.length}</b><span>Total</span></div><div class="stat"><b>${money(total)}</b><span>Acordado próximo</span></div></div><div class="card"><div class="toolbar"><input id="search" class="input" placeholder="Buscar equipo, categoría, cancha, cliente…" value="${esc(filter)}"><select id="statusFilter" class="input"><option value="">Todos los estados</option><option>pendiente</option><option>confirmado</option><option>realizado</option><option>cancelado</option></select><button id="refresh" class="btn ghost">Actualizar</button></div><div id="bookingList" class="list">${list.length?list.map(bookingCard).join(''):'<div class="empty">Todavía no hay contrataciones.</div>'}</div></div>`;$('#search').oninput=e=>renderAdminList(e.target.value);$('#refresh').onclick=()=>renderAdminList($('#search').value);$('#statusFilter').onchange=e=>{const st=e.target.value;document.querySelectorAll('.booking').forEach(c=>c.style.display=!st||c.dataset.status===st?'grid':'none')};wireBookingButtons()}catch(e){body.innerHTML='<div class="notice err">No pude leer las contrataciones desde Firebase. Revisá conexión o reglas de Firestore.</div>'}}
function bookingCard(b){const dl=dateLabel(b.date);const maps=b.address||b.venue?`<button class="btn small green maps" data-id="${esc(b.id)}">📍 Maps</button>`:'';const safeStatus=['pendiente','confirmado','realizado','cancelado'].includes(b.status)?b.status:'pendiente';const home=titleWords(b.home)||'Equipo Local';const away=titleWords(b.away)||'Equipo Visitante';return `<article class="booking status-${esc(safeStatus)}" data-id="${esc(b.id)}" data-status="${esc(safeStatus)}"><div class="datebox"><div class="d">${dl.d}</div><div class="m">${esc(dl.m)}</div></div><div><div class="versus">${esc(home)} <span style="color:#64748b">vs</span> ${esc(away)}</div><div class="meta"><span>⚽ Categoría <strong>${esc(b.category||'Pendiente')}</strong></span><span>🏟️ <strong>${esc(b.venue||'Cancha pendiente')}</strong></span><span>📍 <strong>${esc(b.address||'Dirección pendiente')}</strong></span><span>📸 Llegar <strong>${esc(b.arrivalTime||'--:--')}</strong></span><span>⚽ Partido <strong>${esc(b.matchTime||'--:--')}</strong></span><span>💰 <strong>${money(b.payment)}</strong></span><span>👤 <strong>${esc(b.clientName||'Sin confirmar')}</strong></span></div><div style="margin-top:8px"><span class="status ${esc(b.status||'pendiente')}">${esc(b.status||'pendiente')}</span> <span class="muted">${esc(b.id)}</span></div></div><div class="booking-actions">${maps}<button class="btn small ghost editBooking" data-id="${esc(b.id)}">✏️ Editar</button><button class="btn small red deleteBooking" data-id="${esc(b.id)}">🗑 Eliminar</button><button class="btn small ghost copy" data-id="${esc(b.id)}">Copiar link</button><button class="btn small primary cal" data-id="${esc(b.id)}">Google Calendar</button><button class="btn small ghost ics" data-id="${esc(b.id)}">.ics</button><select class="input statusSel" data-id="${esc(b.id)}" style="padding:8px 10px;width:auto"><option ${b.status==='pendiente'?'selected':''}>pendiente</option><option ${b.status==='confirmado'?'selected':''}>confirmado</option><option ${b.status==='realizado'?'selected':''}>realizado</option><option ${b.status==='cancelado'?'selected':''}>cancelado</option></select></div></article>`}

function publicLink(id){return baseUrl()+'?id='+encodeURIComponent(id)}
async function openEditBooking(id){const b=await loadOne(id);if(!b)return alert('No pude encontrar esta contratación.');const modal=document.createElement('div');modal.style='position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:120;display:grid;place-items:center;padding:16px';modal.innerHTML=`<div class="card" style="width:min(680px,100%);max-height:92vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">Editar contratación</div><h3 style="font-size:26px;margin:8px 0 5px">${esc(titleWords(b.home)||'Equipo Local')} vs ${esc(titleWords(b.away)||'Equipo Visitante')}</h3></div><button type="button" id="closeEdit" class="btn ghost small">✕</button></div><form id="editBookingForm" class="formgrid" style="margin-top:17px"><div class="field"><label>Fecha</label><input class="input" type="date" name="date" value="${esc(b.date||'')}"></div><div class="field"><label>Hora partido</label><input class="input" type="time" name="matchTime" value="${esc(b.matchTime||'')}"></div><div class="field"><label>Equipo local</label><input class="input" name="home" value="${esc(titleWords(b.home))}"></div><div class="field"><label>Equipo visitante</label><input class="input" name="away" value="${esc(titleWords(b.away))}"></div><div class="field"><label>Categoría</label><select class="input" name="category">${categoryOptions(b.category)}</select></div><div class="field"><label>Hora de llegada</label><input class="input" type="time" name="arrivalTime" value="${esc(b.arrivalTime||'')}"></div><div class="field full"><label>Cancha / estadio</label><input class="input" name="venue" value="${esc(b.venue||'')}"></div><div class="field full"><label>Dirección</label><input class="input" name="address" value="${esc(b.address||'')}"></div><div class="field"><label>Cliente</label><input class="input" name="clientName" value="${esc(b.clientName||'')}"></div><div class="field"><label>Teléfono</label><input class="input" name="phone" value="${esc(b.phone||'')}"></div><div class="field"><label>Pago acordado</label><input class="input" type="number" min="0" name="payment" value="${esc(b.payment||0)}"></div><div class="field"><label>Estado</label><select class="input" name="status"><option ${b.status==='pendiente'?'selected':''}>pendiente</option><option ${b.status==='confirmado'?'selected':''}>confirmado</option><option ${b.status==='realizado'?'selected':''}>realizado</option><option ${b.status==='cancelado'?'selected':''}>cancelado</option></select></div><div class="field full"><label>Observaciones</label><textarea class="input" rows="3" name="notes">${esc(b.notes||'')}</textarea></div><div class="field full"><label>Nota privada</label><textarea class="input" rows="2" name="adminNote">${esc(b.adminNote||'')}</textarea></div><div class="field full"><div class="actions"><button class="btn primary" type="submit">Guardar cambios</button><button class="btn ghost" type="button" id="cancelEdit">Cancelar</button></div><div id="editMsg"></div></div></form></div>`;document.body.appendChild(modal);const close=()=>modal.remove();$('#closeEdit').onclick=close;$('#cancelEdit').onclick=close;$('#editBookingForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget).entries());data.home=titleWords(data.home);data.away=titleWords(data.away);data.payment=Number(data.payment||0);$('#editMsg').innerHTML='<div class="notice info">Guardando cambios…</div>';try{await saveBooking(id,data);close();await renderAdminList($('#search')?$('#search').value:'')}catch(err){$('#editMsg').innerHTML='<div class="notice err">No pude guardar los cambios.</div>'}}}
async function deleteBooking(id){const b=await loadOne(id);if(!b)return;const label=`${titleWords(b.home)||'Equipo Local'} vs ${titleWords(b.away)||'Equipo Visitante'}`;if(!confirm(`¿Eliminar definitivamente ${label}? Esta acción no se puede deshacer.`))return;try{await bookingDoc(id).delete();await renderAdminList($('#search')?$('#search').value:'')}catch(err){alert('No pude eliminar la contratación. Revisá la conexión y probá nuevamente.')}}
function wireBookingButtons(){document.querySelectorAll('.editBooking').forEach(btn=>btn.onclick=()=>openEditBooking(btn.dataset.id));document.querySelectorAll('.deleteBooking').forEach(btn=>btn.onclick=()=>deleteBooking(btn.dataset.id));document.querySelectorAll('.copy').forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(publicLink(btn.dataset.id));btn.textContent='Link copiado ✓';setTimeout(()=>btn.textContent='Copiar link',1300)});document.querySelectorAll('.maps').forEach(btn=>btn.onclick=async()=>{const b=await loadOne(btn.dataset.id);window.open(mapsUrl(b),'_blank')});document.querySelectorAll('.cal').forEach(btn=>btn.onclick=async()=>{const b=await loadOne(btn.dataset.id);window.open(calendarUrl(b),'_blank')});document.querySelectorAll('.ics').forEach(btn=>btn.onclick=async()=>downloadIcs(await loadOne(btn.dataset.id)));document.querySelectorAll('.statusSel').forEach(sel=>sel.onchange=async()=>{await saveBooking(sel.dataset.id,{status:sel.value});renderAdminList($('#search')?$('#search').value:'')})}

function startDate(b){if(!b.date)return null;const t=b.arrivalTime||b.matchTime||'00:00';return new Date(`${b.date}T${t}:00`)}
function endDate(b){const s=startDate(b);if(!s)return null;return new Date(s.getTime()+3*60*60*1000)}
function gDate(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`}
function details(b){return `Cobertura fotográfica\nPartido: ${b.home||''} vs ${b.away||''}\nCategoría: ${b.category||''}\nCancha: ${b.venue||''}\nDirección: ${b.address||''}\nHora del partido: ${b.matchTime||''}\nLlegada fotógrafo: ${b.arrivalTime||''}\nCliente: ${b.clientName||''}\nTeléfono: ${b.phone||''}\nPago acordado: ${money(b.payment)}\nObservaciones: ${b.notes||''}`}
function calendarLocation(b){return [b.venue,b.address].filter(Boolean).join(' · ')}
function calendarTitle(b){return `📸 ${b.category?b.category+' · ':''}${b.home||'Local'} vs ${b.away||'Visitante'}`}
function calendarUrl(b){const s=startDate(b),e=endDate(b);if(!s)return '#';const q=new URLSearchParams({action:'TEMPLATE',text:calendarTitle(b),dates:`${gDate(s)}/${gDate(e)}`,details:details(b),location:calendarLocation(b)});return 'https://calendar.google.com/calendar/render?'+q.toString()}
function downloadIcs(b){const s=startDate(b),e=endDate(b);if(!s)return alert('Primero completá la fecha y horario.');const safe=x=>String(x||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const txt=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//lucasabraham.ph//Coberturas//ES\r\nBEGIN:VEVENT\r\nUID:${b.id}@lucasabraham.ph\r\nDTSTAMP:${gDate(new Date())}\r\nDTSTART:${gDate(s)}\r\nDTEND:${gDate(e)}\r\nSUMMARY:${safe(calendarTitle(b))}\r\nLOCATION:${safe(calendarLocation(b))}\r\nDESCRIPTION:${safe(details(b))}\r\nEND:VEVENT\r\nEND:VCALENDAR`;const blob=new Blob([txt],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${b.id}-${(b.home||'partido').replace(/\s+/g,'-')}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function roundedRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function fitText(ctx,text,maxWidth,startSize,minSize=22,weight=800){let size=startSize;do{ctx.font=`${weight} ${size}px Inter, Arial`;if(ctx.measureText(text).width<=maxWidth)return size;size-=2}while(size>minSize);return minSize}
function storyStatus(status){return status==='confirmado'?['#123a25','#86efac']:status==='realizado'?['#142d50','#bfdbfe']:status==='cancelado'?['#431b1b','#fecaca']:['#463311','#fde68a']}
function drawStoryPage(items,page,totalPages){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d');const bg=ctx.createLinearGradient(0,0,1080,1920);bg.addColorStop(0,'#111d3a');bg.addColorStop(.38,'#070b13');bg.addColorStop(1,'#030406');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1920);const glow=ctx.createRadialGradient(900,80,10,900,80,560);glow.addColorStop(0,'rgba(37,99,235,.42)');glow.addColorStop(1,'rgba(37,99,235,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,1080,720);ctx.fillStyle='#7dd3fc';ctx.font='800 25px Inter, Arial';ctx.fillText('LUCASABRAHAM.PH · FOTOGRAFÍA DEPORTIVA',72,108);ctx.fillStyle='#ffffff';ctx.font='900 72px Inter, Arial';ctx.fillText('AGENDA DE',72,190);ctx.fillText('COBERTURAS',72,270);ctx.fillStyle='#9ca3af';ctx.font='600 25px Inter, Arial';const now=new Date();ctx.fillText(`Actualizada ${now.toLocaleDateString('es-AR')} · ${items.length?items.length:'Sin'} cobertura${items.length===1?'':'s'} en esta historia`,74,322);if(totalPages>1){roundedRect(ctx,870,86,138,54,27,'rgba(255,255,255,.08)','rgba(255,255,255,.13)');ctx.fillStyle='#fff';ctx.font='800 22px Inter, Arial';ctx.textAlign='center';ctx.fillText(`${page}/${totalPages}`,939,121);ctx.textAlign='left'}let y=382;const h=166,gap=18;items.forEach(b=>{roundedRect(ctx,64,y,952,h,30,'rgba(10,14,24,.93)','rgba(255,255,255,.11)');roundedRect(ctx,84,y+22,118,122,25,'rgba(37,99,235,.18)','rgba(96,165,250,.28)');const d=b.date?new Date(b.date+'T12:00:00'):null;ctx.fillStyle='#fff';ctx.font='900 47px Inter, Arial';ctx.textAlign='center';ctx.fillText(d?String(d.getDate()).padStart(2,'0'):'--',143,y+77);ctx.fillStyle='#93c5fd';ctx.font='900 19px Inter, Arial';ctx.fillText(d?d.toLocaleDateString('es-AR',{month:'short'}).replace('.','').toUpperCase():'SIN FECHA',143,y+107);ctx.font='700 16px Inter, Arial';ctx.fillText(d?d.toLocaleDateString('es-AR',{weekday:'short'}).replace('.','').toUpperCase():'',143,y+132);ctx.textAlign='left';ctx.fillStyle='#93c5fd';ctx.font='800 18px Inter, Arial';ctx.fillText((b.category||'Categoría pendiente').toUpperCase(),228,y+36);const match=`${b.home||'Equipo local'} vs ${b.away||'Equipo visitante'}`;const fs=fitText(ctx,match,600,31,21,900);ctx.fillStyle='#fff';ctx.font=`900 ${fs}px Inter, Arial`;ctx.fillText(match,228,y+76);ctx.fillStyle='#aab2bf';ctx.font='600 19px Inter, Arial';const venue=(b.venue||'Cancha pendiente').slice(0,58);ctx.fillText(`🏟 ${venue}`,228,y+111);ctx.fillText(`📸 Llegar ${b.arrivalTime||'--:--'}   ·   ⚽ Partido ${b.matchTime||'--:--'}`,228,y+141);const [sb,st]=storyStatus(b.status||'pendiente');roundedRect(ctx,835,y+24,151,42,21,sb,null);ctx.fillStyle=st;ctx.font='800 16px Inter, Arial';ctx.textAlign='center';ctx.fillText((b.status||'pendiente').toUpperCase(),910,y+51);ctx.textAlign='left';y+=h+gap});ctx.fillStyle='#64748b';ctx.font='600 20px Inter, Arial';ctx.fillText('Organización de coberturas · lucasabraham.ph',72,1848);return canvas}
async function downloadAgendaStory(){const btn=$('#storyBtn');if(btn){btn.disabled=true;btn.textContent='Generando…'}try{const visibleIds=[...document.querySelectorAll('.booking')].filter(el=>getComputedStyle(el).display!=='none').map(el=>el.dataset.id);if(!visibleIds.length){alert('No hay coberturas visibles para descargar.');return}const all=await listBookings();const byId=new Map(all.map(b=>[b.id,b]));const visible=visibleIds.map(id=>byId.get(id)).filter(Boolean);const perPage=8,totalPages=Math.ceil(visible.length/perPage);for(let i=0;i<totalPages;i++){const pageItems=visible.slice(i*perPage,(i+1)*perPage);const canvas=drawStoryPage(pageItems,i+1,totalPages);await new Promise(resolve=>canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`agenda-coberturas-${new Date().toISOString().slice(0,10)}${totalPages>1?'-'+(i+1):''}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);resolve()},'image/png',1))}}catch(err){console.error(err);alert('No pude generar la historia de la agenda.')}finally{if(btn){btn.disabled=false;btn.textContent='⬇ Historia agenda'}}}
function openNew(){const modal=document.createElement('div');modal.style='position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:99;display:grid;place-items:center;padding:16px';modal.innerHTML=`<div class="card" style="width:min(520px,100%);max-height:92vh;overflow:auto"><div class="eyebrow">Nueva contratación</div><h3 style="font-size:26px;margin:8px 0 5px">Crear formulario</h3><p class="copy">Vos cargás el pago acordado. Después compartís el link y el cliente completa los datos del partido, incluida la categoría, la cancha y su dirección.</p><form id="draftForm" class="formgrid" style="margin-top:17px"><div class="field full"><label>Pago acordado</label><input required class="input" type="number" min="0" name="payment" placeholder="Ej: 60000"></div><div class="field full"><label>Nota privada para vos (opcional)</label><textarea class="input" rows="3" name="adminNote" placeholder="Ej: cobertura de Primera + Reserva"></textarea></div><div class="field full"><div class="actions"><button class="btn primary" type="submit">Crear y obtener link</button><button class="btn ghost" type="button" id="closeModal">Cerrar</button></div><div id="draftMsg"></div></div></form></div>`;document.body.appendChild(modal);$('#closeModal').onclick=()=>modal.remove();$('#draftForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.currentTarget).entries());const msg=$('#draftMsg');msg.innerHTML='<div class="notice info">Creando solicitud…</div>';try{const b=await createDraft(f);const link=publicLink(b.id);msg.innerHTML=`<div class="notice ok"><b>Solicitud creada:</b> ${b.id}</div><div class="sharebox"><input class="input" readonly value="${esc(link)}"><button type="button" id="copyDraft" class="btn green">Copiar link</button></div>`;$('#copyDraft').onclick=async()=>{await navigator.clipboard.writeText(link);$('#copyDraft').textContent='Copiado ✓'};renderAdminList()}catch(err){msg.innerHTML='<div class="notice err">No pude crear la solicitud en Firebase.</div>'}}}
async function boot(){const ok=await initFirebase();if(!ok){$('#app').innerHTML=appShell('<div class="notice err">No se pudo iniciar Firebase.</div>');return}const params=new URLSearchParams(location.search);const id=params.get('id');if(location.hash==='#/admin'||(!id&&location.hash==='#/admin'))return adminPage();if(id){const b=await loadOne(id);if(!b){$('#app').innerHTML=appShell('<div class="card success"><h2>Solicitud no encontrada</h2><p class="copy">El link puede estar incompleto o haber sido eliminado.</p><a class="btn primary" href="'+galleryUrl()+'" style="text-decoration:none;margin-top:16px">Ir a la galería</a></div>');return}if(b.status==='confirmado'||b.status==='realizado')return renderSuccess(b);return publicForm(b)}location.hash='#/admin';adminPage()}
boot();
</script>
