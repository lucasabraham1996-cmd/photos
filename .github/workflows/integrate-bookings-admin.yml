name: Integrate bookings admin

on:
  push:
    branches: [feature/contrataciones-agenda]
    paths: [.github/workflows/integrate-bookings-admin.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Integrate bookings access and self-remove
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/contrataciones-agenda';
            const workflowPath = '.github/workflows/integrate-bookings-admin.yml';
            const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            const parentSha = ref.data.object.sha;
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: parentSha});
            const file = await github.rest.repos.getContent({owner, repo, path: 'index.html', ref: branch});
            const source = Buffer.from(file.data.content, 'base64').toString('utf8');
            const anchor = 'React.createElement("div", { id: "order-search-panel", className: "bg-neutral-900 border border-neutral-800 rounded-3xl p-5 mb-6" }';
            if (!source.includes(anchor)) throw new Error('No se encontró el panel de pedidos para insertar Contrataciones.');
            if (source.includes('Contrataciones / Agenda')) {
              console.log('El acceso ya está integrado.');
              return;
            }
            const card = `React.createElement("section", { className: "relative overflow-hidden bg-gradient-to-br from-sky-500/15 via-blue-600/10 to-neutral-900 border border-sky-400/20 rounded-3xl p-5 sm:p-6 mb-6" },
                React.createElement("div", { className: "absolute -right-10 -top-12 w-40 h-40 bg-sky-400/10 blur-3xl rounded-full pointer-events-none" }),
                React.createElement("div", { className: "relative flex flex-col md:flex-row md:items-center justify-between gap-5" },
                    React.createElement("div", { className: "flex items-start gap-4" },
                        React.createElement("div", { className: "w-12 h-12 rounded-2xl bg-sky-400/15 border border-sky-300/20 flex items-center justify-center shrink-0" },
                            React.createElement("i", { className: "fas fa-calendar-check text-sky-300 text-xl" })),
                        React.createElement("div", null,
                            React.createElement("div", { className: "flex items-center gap-2 flex-wrap mb-1" },
                                React.createElement("h2", { className: "text-xl font-black" }, "Contrataciones / Agenda"),
                                React.createElement("span", { className: "px-2 py-1 rounded-full bg-sky-400/15 text-sky-200 border border-sky-300/20 text-[9px] font-black uppercase tracking-[.14em]" }, "Nuevo")),
                            React.createElement("p", { className: "text-sm text-neutral-300 leading-relaxed max-w-2xl" }, "Creá formularios para clientes, recibí los datos de cada partido y organizá tus coberturas con acceso directo a Google Calendar."))),
                    React.createElement("button", { onClick: () => { try { sessionStorage.setItem('la_booking_admin', '1'); } catch (e) {} location.href = 'contrataciones.html#/admin'; }, className: "w-full md:w-auto bg-gradient-to-r from-sky-400 to-blue-600 text-white px-5 py-3.5 rounded-2xl font-black shadow-[0_16px_40px_rgba(37,99,235,.25)] hover:brightness-110 transition" },
                        React.createElement("i", { className: "fas fa-calendar-days mr-2" }),
                        "Abrir contrataciones"))),
            `;
            const next = source.replace(anchor, card + anchor);
            const blob = await github.rest.git.createBlob({owner, repo, content: next, encoding: 'utf-8'});
            const tree = await github.rest.git.createTree({
              owner, repo,
              base_tree: parent.data.tree.sha,
              tree: [
                {path: 'index.html', mode: '100644', type: 'blob', sha: blob.data.sha},
                {path: workflowPath, mode: '100644', type: 'blob', sha: null}
              ]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'feat: integrar contrataciones en panel admin',
              tree: tree.data.sha,
              parents: [parentSha]
            });
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            console.log(`Commit creado: ${commit.data.sha}`);
