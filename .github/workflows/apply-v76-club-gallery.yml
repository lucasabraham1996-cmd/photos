name: Apply v76 gallery and club update
on:
  push:
    paths:
      - '.github/scripts/apply_v76_club_gallery.py'
      - '.github/workflows/apply-v76-club-gallery.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          sed -i "s/replace_once('v75-mobile-tight-club-close', 'v76-club-gallery-points-reset', 'app-version')/s = s.replace('v75-mobile-tight-club-close', 'v76-club-gallery-points-reset')/" .github/scripts/apply_v76_club_gallery.py
          python3 .github/scripts/apply_v76_club_gallery.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v76-club-gallery-points-reset' index.html
          grep -q 'club-pack-3-fotos-10x15' index.html
          grep -q 'addManualClubPoints' index.html
          grep -q 'ADMIN_HISTORY_RESET_AT' index.html
          test $(wc -c < index.html) -gt 400000
      - name: Commit
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git commit -m 'feat: gallery order, Club product and manual points'
          git push
