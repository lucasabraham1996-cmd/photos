name: Apply v88 admin gallery navigation
on:
  push:
    paths:
      - '.github/scripts/apply_v88_admin_gallery_nav.py'
      - '.github/workflows/apply-v88-admin-gallery-navigation.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v88_admin_gallery_nav.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v88-admin-gallery-navigation' index.html
          grep -q 'const goToGallery = () =>' index.html
          grep -q 'onClick: goToGallery' index.html
          grep -q 'recoverAdminShortcut' index.html
          grep -q 'aria-label":"Administración' index.html
          test "$(grep -o 'admin-secret-footer" }, React.createElement' index.html | wc -l)" -eq 0
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make admin gallery navigation reliable and hide footer access'
          git push
