name: Apply silent order sync v119

on:
  push:
    branches: [main]
    paths:
      - 'scripts/silent_order_sync_v119.py'
      - '.github/workflows/apply-silent-order-sync-v119.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v119 patch
        run: python3 scripts/silent_order_sync_v119.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          shopt -s nullglob
          for f in /tmp/index-*.js; do node --check "$f"; done

      - name: Verify silent deferred sync
        run: |
          grep -q 'v119-silent-order-sync' index.html
          ! grep -q 'quedó guardado en este dispositivo y se sincronizará automáticamente' index.html
          ! grep -q 'quedó guardado en este dispositivo y pendiente de sincronización' index.html

      - name: Commit v119
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Hide deferred order sync banner after checkout"
            git push origin HEAD:main
          fi
