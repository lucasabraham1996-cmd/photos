name: Apply v78 redemption contact
on:
  push:
    paths:
      - '.github/scripts/apply_v78_redemption_contact.py'
      - '.github/workflows/apply-v78-redemption-contact.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v78_redemption_contact.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v78-redemption-contact' index.html
          grep -q 'customerWhatsappUrl' index.html
          grep -q 'Hablar por WhatsApp para coordinar' index.html
          grep -q 'ENTREGAR A' index.html
      - name: Commit
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git commit -m 'feat: highlight Club redemption contact details'
          git push
