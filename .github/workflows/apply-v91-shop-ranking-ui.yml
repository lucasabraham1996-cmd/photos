name: Apply v91 shop ranking ui
on:
  push:
    paths:
      - '.github/scripts/apply_v91_shop_ranking_ui.py'
      - '.github/workflows/apply-v91-shop-ranking-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v91_shop_ranking_ui.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v91-ranking-cart-recovery-ui' index.html
          grep -q 'LA_RECOVER_CART' index.html
          grep -q 'CARRITO_SIN_LIMITE' index.html
          grep -q 'Restaurar carrito' index.html
          grep -q 'Cancelar carrito' index.html
          grep -q 'visibleClubRankingStats' index.html
          grep -q 'filter(r => Number(r.points || 0) > 0)' index.html
          grep -q 'Cerrar vista previa' index.html
          grep -q 'club-ranking-more' index.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: improve Club ranking and restore unlimited carts'
          git push
