name: Apply v85 admin footer and Club logo
on:
  push:
    paths:
      - '.github/scripts/apply_v85_admin_footer_club_logo.py'
      - '.github/workflows/apply-v85-admin-footer-club-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v85_admin_footer_club_logo.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v85-admin-footer-club-logo' index.html
          grep -q 'jSdxMNpb/LA-Marca-de-agua-copia2.png' index.html
          grep -q 'admin-footer-access-v85' index.html
          grep -q 'Administración' index.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: show admin footer and use circular Club logo'
          git push
