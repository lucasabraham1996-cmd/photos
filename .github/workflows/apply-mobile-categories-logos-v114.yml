name: Apply mobile categories and smart logos v114

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_mobile_categories_logos_v114.py'
      - '.github/workflows/apply-mobile-categories-logos-v114.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v114 patch
        run: python3 scripts/refine_mobile_categories_logos_v114.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Verify v114 changes
        run: |
          grep -q 'v114-mobile-categories-smart-logos' index.html
          grep -q 'teamLogoTokens' index.html
          grep -q 'v114-mobile-category-tabs-smart-logo' index.html
          grep -q 'appLogo' index.html
      - name: Commit v114
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Modernize mobile category selector and improve team crest fallback"
            git push origin HEAD:main
          fi
