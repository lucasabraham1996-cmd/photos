name: Cleanup v71 migration files
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "lucasabraham1996-cmd"
          git config user.email "lucasabraham1996@gmail.com"
          git rm -f .github/scripts/apply_v71_club.py || true
          git rm -f .github/workflows/apply-v71-club.yml || true
          git rm -f .github/workflows/apply-v71-club-fix.yml || true
          git rm -f .github/workflows/apply-v71-club-final.yml || true
          git rm -f .github/workflows/apply-v71-club-release.yml || true
          git rm -f .github/workflows/apply-v71-club-release2.yml || true
          git rm -f .github/workflows/diagnose-v71-syntax.yml || true
          git rm -f .github/workflows/cleanup-v71-temp.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove v71 migration tooling"
          git push
