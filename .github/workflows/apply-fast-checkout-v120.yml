name: Apply fast checkout v120

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fast_checkout_v120.py'
      - '.github/workflows/apply-fast-checkout-v120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fast checkout patch
        run: python3 scripts/fast_checkout_v120.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done

      - name: Verify fast checkout
        run: |
          grep -q 'v120-fast-checkout' index.html
          grep -q "const opened=window.open(whatsappUrl,'_blank')" index.html
          grep -q 'pendingSync:true' index.html

      - name: Commit v120
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Speed up checkout finalization"
            git push origin HEAD:main
          fi
