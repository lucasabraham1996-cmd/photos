name: Apply v97 unified LCF teams
on:
  push:
    paths:
      - '.github/scripts/apply_v97_unified_lcf_teams.py'
      - '.github/workflows/apply-v97-unified-lcf-teams.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contrataciones
        run: python3 .github/scripts/apply_v97_unified_lcf_teams.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate picker
        run: |
          grep -q 'v97-unified-lcf-teams' contrataciones.html
          grep -q 'Otro equipo' contrataciones.html
          ! grep -q 'team-picker-group' contrataciones.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          block=s.split('const LCF_TEAMS=[',1)[1].split('];',1)[0]
          assert block.count("{name:")==42, block.count("{name:")
          assert 'Unión Serrana' not in block
          print('42 active LCF teams validated')
          PY
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify Liga Cordobesa team picker and clean crests'
          git push
