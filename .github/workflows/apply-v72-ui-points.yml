          new="""    const pointsForPurchase = (amount) => {\n        const value = Math.max(0, Number(amount) || 0);\n        return Math.floor(value / 5000) + (value >= 10000 ? 1 : 0);\n    };\n    const projectedPointsForPurchase = (account, amount) => {\n        const a = account || { spent:0, earnedPoints:0, directBonusPoints:0 };\n        const value = Math.max(0, Number(amount) || 0);\n        const projectedBase = Math.floor((Math.max(0, Number(a.spent) || 0) + value) / 5000);\n        const projectedBonus = Math.max(0, Number(a.directBonusPoints) || 0) + (value >= 10000 ? 1 : 0);\n        return Math.max(0, projectedBase + projectedBonus - Math.max(0, Number(a.earnedPoints) || 0));\n    };\n    const clubAccountFromOrders = (list, rawDni) => {\n        const dni = String(rawDni || '').replace(/\\D/g, '');\n        const account = { dni, name:'', phone:'', purchases:0, spent:0, pending:0, cancelled:0, prints:0, redeemedPoints:0, redemptions:0, earnedPoints:0, directBonusPoints:0, points:0 };"""
