          rep("""    function openOrderFromQueue(order) {\n        if (!(order === null || order === void 0 ? void 0 : order.id))\n            return;\n        setOrderSearch('#' + order.id);""","""    function openOrderFromQueue(order) {\n        if (!(order === null || order === void 0 ? void 0 : order.id))\n            return;\n        markAdminReviewed(order.id);\n        setAdminNotificationsOpen(false);\n        setOrderSearch('#' + order.id);""",'review on open')

