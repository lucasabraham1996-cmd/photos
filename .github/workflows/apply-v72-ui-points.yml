          .admin-notif-shell{position:relative;margin-bottom:14px}.admin-notif-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:18px;background:linear-gradient(135deg,rgba(249,115,22,.13),rgba(15,23,42,.86));border:1px solid rgba(249,115,22,.24);color:#fff}.admin-notif-left{display:flex;align-items:center;gap:11px;min-width:0}.admin-notif-icon{position:relative;width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(249,115,22,.16);color:#fb923c}.admin-notif-count{position:absolute;right:-6px;top:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ef4444;color:white;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:950;border:2px solid #111}.admin-notif-panel{margin-top:8px;border:1px solid rgba(255,255,255,.09);background:#0a0a0d;border-radius:18px;padding:10px;box-shadow:0 20px 55px rgba(0,0,0,.42)}.admin-notif-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);margin-bottom:6px}.admin-notif-item:last-child{margin-bottom:0}.admin-notif-kind{font-size:9px;font-weight:950;border-radius:999px;padding:4px 7px}.admin-notif-kind.order{background:rgba(59,130,246,.15);color:#bfdbfe}.admin-notif-kind.club{background:rgba(249,115,22,.15);color:#fed7aa}
          .price-button-only{margin:18px 0 20px;display:flex;justify-content:flex-start}.price-button-only .booking-btn{background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#03140a!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 12px 28px rgba(34,197,94,.22)!important}
          @media(max-width:640px){.club-floating-btn{right:12px;bottom:112px;padding:11px 13px}.club-modal-shell{padding:14px;border-radius:20px}.club-modal-title{font-size:22px}.checkout-floating-cta{bottom:max(8px,env(safe-area-inset-bottom));width:calc(100vw - 20px)}.price-button-only{justify-content:center}.price-button-only .booking-btn{width:100%}}
          </style>
          '''
          rep('</head>',css+'</head>','head')

