          .club-modal-shell{position:relative;border-radius:24px;padding:18px;background:radial-gradient(circle at 10% 0%,rgba(249,115,22,.18),transparent 34%),linear-gradient(145deg,#101014,#07070a);border:1px solid rgba(249,115,22,.20);box-shadow:0 30px 80px rgba(0,0,0,.48)}
