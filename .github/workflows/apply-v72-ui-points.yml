          old='''    const saveCheckoutCustomer = () => {\n        const name = String(checkoutCustomerName || "").trim().replace(/\\s{2,}/g, " ");\n        const phone = normalizePhone(checkoutPhone);\n        const dni = normalizeDni(checkoutDni);\n        if (!name) { alert("Ingresá nombre y apellido."); return; }\n        if (!phone) { alert("Ingresá un celular de contacto."); return; }\n        setCheckoutCustomerName(name);\n        setCheckoutPhone(phone);\n        setCheckoutDni(dni);\n        setCheckoutWantsPoints(Boolean(dni));\n        setCustomerDetailsSaved(true);\n        setCustomerSavedMessage("✓ Datos guardados correctamente");\n        setTimeout(() => { setCustomerDetailsOpen(false); setCustomerSavedMessage(""); }, 900);\n    };'''
          new='''    const saveCheckoutCustomer = async () => {\n        const name = String(checkoutCustomerName || "").trim().replace(/\\s{2,}/g, " ");\n        const phone = normalizePhone(checkoutPhone);\n        const dni = normalizeDni(checkoutDni);\n        if (!name) { alert("Ingresá nombre y apellido."); return; }\n        if (!phone) { alert("Ingresá un celular de contacto."); return; }\n        setCheckoutCustomerName(name);\n        setCheckoutPhone(phone);\n        setCheckoutDni(dni);\n        setCheckoutWantsPoints(Boolean(dni));\n        setCustomerDetailsSaved(true);\n        setCustomerSavedMessage("✓ Datos guardados correctamente");\n        setCheckoutPriorClubAccount(null);\n        if (dni) {\n            setCheckoutPointsLoading(true);\n            try {\n                const history = await loadClubOrdersForDni(dni);\n                setCheckoutPriorClubAccount(clubAccountFromOrders(history, dni));\n            } catch(e) {\n                console.warn('No se pudieron consultar puntos previos en checkout.', e);\n            } finally { setCheckoutPointsLoading(false); }\n        }\n        setTimeout(() => { setCustomerDetailsOpen(false); setCustomerSavedMessage(""); }, 900);\n    };'''
          rep(old,new,'save customer async points')

