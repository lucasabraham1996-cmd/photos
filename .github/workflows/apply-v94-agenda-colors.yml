name: Apply v94 agenda colors
on:
  push:
    paths:
      - '.github/scripts/apply_v94_agenda_colors.py'
      - '.github/workflows/apply-v94-agenda-colors.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agenda colors
        run: python3 .github/scripts/apply_v94_agenda_colors.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate colors
        run: |
          grep -q '.booking.status-pendiente{border-color:rgba(59,130,246' contrataciones.html
          grep -q '.booking.status-realizado{border-color:rgba(34,197,94' contrataciones.html
          grep -q '.booking.status-cancelado{border-color:rgba(239,68,68' contrataciones.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: update agenda status colors'
          git push
