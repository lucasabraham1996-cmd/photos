name: Retry v102 reliable orders
on:
  push:
    paths:
      - '.github/workflows/retry-v102-reliable-orders.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare repair and corrected regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/order-storage-v102.js')
          s=p.read_text(encoding='utf-8')
          old="ref.collection('payload').doc(String(i+n).padStart(6,'0'))"
          assert s.count(old)==2
          s=s.replace(old,"ref.parent.doc(ref.id+'__p'+String(i+n).padStart(6,'0'))")
          s=s.replace("function localRead(){try{return JSON.parse(localStorage.getItem(fallback)||'[]')}catch(e){return []}}", "function localRead(){try{const v=JSON.parse(localStorage.getItem(fallback)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}")
          p.write_text(s,encoding='utf-8')
          original=Path('.github/workflows/apply-v102-reliable-orders.yml').read_text(encoding='utf-8')
          start=original.index("          node <<'JS'\n")+len("          node <<'JS'\n")
          end=original.index("\n          JS",start)
          test='\n'.join(line[10:] if line.startswith('          ') else line for line in original[start:end].splitlines())
          old='compactOrderForScript:o=>o'
          assert test.count(old)==1
          test=test.replace(old,"compactOrderForScript:o=>({...o,items:o.items.map(({id,code,price,printRequested})=>({id,code,price,printRequested}))})")
          Path('/tmp/la-v102-tests.js').write_text(test+'\n',encoding='utf-8')
          PY
          python3 .github/scripts/apply_v102_reliable_orders.py
      - name: Validate and run regression tests
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Scripts(HTMLParser):
            def __init__(self): super().__init__();self.active=False;self.chunks=[];self.blocks=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs);self.active='src' not in a and a.get('type','text/javascript') in ('text/javascript','application/javascript','module','');self.chunks=[]
            def handle_data(self,data):
              if self.active:self.chunks.append(data)
            def handle_endtag(self,tag):
              if tag=='script':
                if self.active:self.blocks.append(''.join(self.chunks))
                self.active=False
          p=Scripts();p.feed(Path('index.html').read_text(encoding='utf-8'))
          assert p.blocks
          for i,block in enumerate(p.blocks):
            if block.strip():
              f=Path('/tmp/la-inline-%d.js'%i);f.write_text(block,encoding='utf-8');subprocess.run(['node','--check',str(f)],check=True)
          print('PASS: all inline JavaScript parses')
          PY
          node /tmp/la-v102-tests.js
          grep -q 'v102-reliable-orders' index.html
          grep -q 'LAOrderStorage.persist' index.html
          grep -q 'LAOrderStorage.hydrate' index.html
          grep -q 'LAOrderOutbox.put' index.html
          grep -q 'safeOrderWhatsappUrl' index.html
          grep -q 'checkoutSaveError' index.html
      - name: Commit functional changes
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html .github/scripts/order-storage-v102.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist and recover large photo orders reliably'
          git push
