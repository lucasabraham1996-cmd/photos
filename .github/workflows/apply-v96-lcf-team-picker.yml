name: Apply v96 LCF team picker
on:
  push:
    paths:
      - '.github/scripts/apply_v96_lcf_team_picker.py'
      - '.github/workflows/apply-v96-lcf-team-picker.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contrataciones
        run: python3 .github/scripts/apply_v96_lcf_team_picker.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate picker
        run: |
          grep -q 'const LCF_TEAMS=' contrataciones.html
          grep -q "division:'Primera A'" contrataciones.html
          grep -q "division:'Primera B'" contrataciones.html
          grep -q 'Otro equipo' contrataciones.html
          grep -q 'team-picker-trigger' contrataciones.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          block=s.split('const LCF_TEAMS=[',1)[1].split('];',1)[0]
          assert block.count("division:'Primera A'")==22, block.count("division:'Primera A'")
          assert block.count("division:'Primera B'")==20, block.count("division:'Primera B'")
          print('42 LCF teams validated')
          PY
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add Liga Cordobesa team picker to bookings'
          git push
