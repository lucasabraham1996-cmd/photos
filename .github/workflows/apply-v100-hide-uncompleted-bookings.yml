name: Apply v100 hide uncompleted bookings
on:
  push:
    paths:
      - '.github/scripts/apply_v100_hide_uncompleted_bookings.py'
      - '.github/workflows/apply-v100-hide-uncompleted-bookings.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contrataciones
        run: python3 .github/scripts/apply_v100_hide_uncompleted_bookings.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate hidden drafts
        run: |
          grep -q 'v100-hide-uncompleted-bookings' contrataciones.html
          grep -q 'formCompleted:false' contrataciones.html
          grep -q 'formCompleted:true' contrataciones.html
          grep -q 'function isAgendaBooking' contrataciones.html
          grep -q 'items=items.filter(isAgendaBooking)' contrataciones.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: hide uncompleted booking links from agenda'
          git push
