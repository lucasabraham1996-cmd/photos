name: Apply v100 night tariff admin
on:
  push:
    paths:
      - '.github/scripts/apply_v100_night_tariff_admin.py'
      - '.github/workflows/apply-v100-night-tariff-admin.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prices and bookings
        run: python3 .github/scripts/apply_v100_night_tariff_admin.py
      - name: Validate contrataciones JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate Admin tariff integration
        run: |
          grep -q 'pricingVersion: 3' index.html
          grep -q 'nightMatchPrice: "$75.000"' index.html
          grep -q 'fieldKey: "nightMatchPrice"' index.html
          grep -q 'Partido nocturno' index.html
          grep -q 'Link público de solicitudes copiado' index.html
          grep -q 'SHARED_STATE_DOC_PATH' contrataciones.html
          grep -q 'loadNightMatchPrice' contrataciones.html
          grep -q 'await loadNightMatchPrice' contrataciones.html
          grep -q 'NIGHT_MATCH_PRICE_FALLBACK=75000' contrataciones.html
          ! grep -q 'id="draftService"' contrataciones.html
          ! grep -q 'id="editService"' contrataciones.html
          grep -q 'contrataciones.html#/solicitar' index.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: manage night tariff from Admin prices'
          git push
