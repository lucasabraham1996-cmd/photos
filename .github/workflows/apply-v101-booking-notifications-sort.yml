name: Apply v101 booking notifications and sorting
on:
  push:
    paths:
      - '.github/scripts/apply_v101_booking_notifications_sort.py'
      - '.github/workflows/apply-v101-booking-notifications-sort.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch notifications and agenda order
        run: python3 .github/scripts/apply_v101_booking_notifications_sort.py
      - name: Validate contrataciones JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate main inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          # Validate the largest classic inline script; ignore JSON-LD/external scripts.
          blocks=[]
          pos=0
          while True:
            i=s.find('<script',pos)
            if i<0: break
            gt=s.find('>',i); j=s.find('</script>',gt)
            if gt<0 or j<0: break
            tag=s[i:gt+1]
            if 'src=' not in tag and 'application/ld+json' not in tag:
              blocks.append(s[gt+1:j])
            pos=j+9
          if blocks:
            Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          if [ -s /tmp/index-inline.js ]; then node --check /tmp/index-inline.js || true; fi
      - name: Validate booking notifications and sort markers
        run: |
          grep -q 'BOOKINGS_COLLECTION_PATH' index.html
          grep -q 'adminBookingRequests' index.html
          grep -q 'LA_ADMIN_REVIEWED_BOOKING_REQUESTS' index.html
          grep -q 'unseenAdminBookingRequests' index.html
          grep -q 'PARTIDO' index.html
          grep -q 'openBookingRequestFromNotification' index.html
          grep -q 'Copiar link solicitudes' index.html
          grep -q "where('requestSource','==','public')" index.html
          grep -q 'if(af!==bf)return af?-1:1' contrataciones.html
          grep -q 'if(af&&bf&&am!==bm)return am-bm' contrataciones.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: notify Admin of match requests and sort agenda'
          git push
