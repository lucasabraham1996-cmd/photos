name: Apply match picker filters v117

on:
  push:
    branches: [main]
    paths:
      - 'scripts/match_picker_filters_v117.py'
      - '.github/workflows/apply-match-picker-filters-v117.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v117 patch
        run: python3 scripts/match_picker_filters_v117.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done

      - name: Verify match picker filters
        run: |
          grep -q 'v117-match-picker-filters' index.html
          grep -q 'Filtrar por equipo' index.html
          grep -q 'Filtrar por categoría' index.html
          grep -q 'canonicalMatchPickerCategory' index.html
          grep -q 'match-picker-filter-panel' index.html
          grep -q 'max-width:104px' index.html

      - name: Commit v117
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Improve match picker shields and collapsible filters"
            git push origin HEAD:main
          fi
