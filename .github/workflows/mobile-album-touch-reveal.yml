name: Apply mobile album swipe reveal

on:
  push:
    paths:
      - '.github/workflows/mobile-album-touch-reveal.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile swipe reveal patch
        run: python3 scripts/apply_mobile_swipe_reveal.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); b=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S); Path('/tmp/index-inline.js').write_text('\\n'.join(x for x in b if x.strip() and not x.lstrip().startswith('window.tailwind')),encoding='utf-8')"
          node --check /tmp/index-inline.js
      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reveal album covers while swiping on mobile"
          git push
