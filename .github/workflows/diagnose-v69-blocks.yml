name: Diagnose v69 blocks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test removing admin block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          start='            React.createElement("div", { className: "bg-neutral-900 border border-neutral-800 rounded-3xl p-5 mb-6" },\n                React.createElement("h2", { className: "text-xl font-black" }, "Beneficios por DNI"),'
          end='            React.createElement("div", { id: "order-search-panel", className: "bg-neutral-900 border border-neutral-800 rounded-3xl p-5 mb-6" },'
          if start not in html or end not in html: raise SystemExit('anchors missing')
          a=html.index(start); b=html.index(end,a)
          variant=html[:a]+html[b:]
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', variant, flags=re.S|re.I)
          Path('/tmp/main.js').write_text(max(scripts,key=len),encoding='utf-8')
          print('removed admin chars', b-a)
          PY
          node --check /tmp/main.js
