name: Diagnose gallery sources
on:
  push:
    paths:
      - .github/workflows/diagnose-gallery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check gallery endpoints
        run: python3 scripts/diagnose-gallery.py
