name: Apply v101 booking services and crests
on:
  push:
    paths:
      - '.github/scripts/apply_v101_booking_services_crests.py'
      - '.github/workflows/apply-v101-booking-services-crests.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python3 -m pip install --quiet pillow requests
      - name: Patch bookings and crests
        run: python3 .github/scripts/apply_v101_booking_services_crests.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate booking rules
        run: |
          grep -q 'v101-booking-services-crests' contrataciones.html
          grep -q 'const NIGHT_MATCH_PRICE=75000' contrataciones.html
          grep -q "name=\\\"endTime\\\"" contrataciones.html
          grep -q "teamPickerMarkup('home','Equipo local',b.home)" contrataciones.html
          grep -q "teamPickerMarkup('away','Equipo visitante',b.away)" contrataciones.html
          grep -q 'initTeamPickers();const editForm' contrataciones.html
          grep -q 'completed&&core&&hasEndTime' contrataciones.html
          grep -q 'formCompleted:true' contrataciones.html
      - name: Validate selected crest PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=['all-boys.png','belgrano.png','talleres.png','cibi.png','deportivo-alberdi.png','deportivo-atalaya.png','deportivo-banfield.png','general-paz-juniors.png','los-andes.png','union-florida.png','villa-azalais.png']
          for name in names:
              p=Path('assets/lcf')/name
              assert p.exists() and p.stat().st_size>1500, (name,'missing/small')
              im=Image.open(p).convert('RGBA')
              assert im.size==(512,512), (name,im.size)
              lo,hi=im.getchannel('A').getextrema()
              assert lo==0 and hi>0, (name,(lo,hi))
          print('11 selected transparent crest PNGs validated')
          PY
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html assets/lcf
          git diff --cached --quiet && exit 0
          git commit -m 'feat: improve booking editor, night service and crests'
          git push
