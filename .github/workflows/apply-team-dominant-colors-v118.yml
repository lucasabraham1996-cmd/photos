name: Apply team dominant colors v118

on:
  push:
    branches: [main]
    paths:
      - 'scripts/team_dominant_colors_v118.py'
      - '.github/workflows/apply-team-dominant-colors-v118.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v118 patch
        run: python3 scripts/team_dominant_colors_v118.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done

      - name: Verify dominant team colors
        run: |
          grep -q 'v118-team-dominant-colors' index.html
          grep -q "cibi: '#facc15'" index.html
          grep -q "lasallano: '#2563eb'" index.html
          grep -q 'function dominantTeamColor' index.html
          grep -q 'const dominantColor = dominantTeamColor(displayName, appLogo);' index.html
          grep -q 'teamColors: teamEntries.map' index.html

      - name: Commit v118
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use dominant crest colors for CIBI and Lasallano"
            git push origin HEAD:main
          fi
