name: Diagnose index startup
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check inline scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          print('inline scripts:', len(scripts))
          out=Path('/tmp/la-scripts'); out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts):
              p=out/f'script-{i}.js'; p.write_text(s,encoding='utf-8')
              print(i, len(s), p)
          PY
          fail=0
          for f in /tmp/la-scripts/*.js; do
            echo "CHECK $f"
            node --check "$f" || fail=1
          done
          exit $fail
