name: Apply checkout and gallery improvements
on:
  push:
    paths:
      - .github/workflows/inspect-purchase.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 scripts/checkout-performance-fix.py
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.S|re.I)
          for i,script in enumerate(scripts):
              if script.strip(): Path(f'/tmp/la-script-{i}.js').write_text(script)
          print('Extracted',len(scripts),'script blocks')
          PY
          for file in /tmp/la-script-*.js; do node --check "$file"; done
      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Club optional and speed up gallery rendering"
          git push origin HEAD:main
