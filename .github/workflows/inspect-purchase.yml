name: Inspect purchase flow
on:
  push:
    paths:
      - .github/workflows/inspect-purchase.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect checkout and gallery code
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html').read()
          lines=s.splitlines()
          patterns=[r'function\s+\w*(?:Checkout|checkout|Order|order)',r'const\s+\w*(?:Checkout|checkout|Order|order)\s*=',r'checkout-simple-shell',r'checkout-floating-cta',r'checkout-save-error',r'clubUser',r'clubMember',r'loginRequired',r'auth\.currentUser',r'onAuthStateChanged',r'getDocs\(',r'getDownloadURL\(',r'loading=["\']',r'fetchpriority',r'loading="lazy"']
          hits=[]
          for i,line in enumerate(lines):
            if any(re.search(p,line) for p in patterns): hits.append(i)
          selected=set()
          for i in hits:
            for j in range(max(0,i-4),min(len(lines),i+7)):selected.add(j)
          for i in sorted(selected):
            line=lines[i]
            if len(line)>1800:line=line[:1800]+' [TRUNCATED]'
            print(f'{i+1}: {line}')
          print('TOTAL_LINES',len(lines),'TOTAL_BYTES',len(s.encode()))
          PY
