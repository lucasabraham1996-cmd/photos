name: Apply v74 mobile spacing club close
on:
  push:
    paths:
      - '.github/scripts/apply_v74_mobile_spacing_club_close.py'
      - '.github/workflows/apply-v74-mobile-spacing-club-close.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v74_mobile_spacing_club_close.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v74-mobile-spacing-club-close' index.html
          grep -q 'club-modal-close' index.html
          grep -q 'max-w-6xl mx-auto px-4 pt-0 pb-8' index.html
          grep -q 'max-w-5xl mx-auto pt-0 sm:pt-4 pb-4 px-0' index.html
      - name: Commit
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git commit -m 'fix: reduce mobile header gap and add Club close button'
          git push
