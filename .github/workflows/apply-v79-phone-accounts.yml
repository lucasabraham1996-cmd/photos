name: Apply v79 phone accounts
on:
  push:
    paths:
      - '.github/scripts/apply_v79_phone_accounts.py'
      - '.github/workflows/apply-v79-phone-accounts.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/apply_v79_phone_accounts.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          pos=0
          while True:
              i=s.find('<script',pos)
              if i<0: raise SystemExit('main script not found')
              j=s.find('>',i); k=s.find('</script>',j)
              tag=s[i:j+1]; body=s[j+1:k]
              if 'src=' not in tag and 'function App()' in body:
                  Path('/tmp/app-check.js').write_text(body,encoding='utf-8'); break
              pos=k+9
          PY
          node --check /tmp/app-check.js
      - name: Validate markers
        run: |
          grep -q 'v79-phone-club-accounts' index.html
          grep -q 'normalizeClubPhone' index.html
          grep -q 'registerClubUser' index.html
          grep -q 'transferClubPoints' index.html
          grep -q 'LA_INSTALL_START_ROUTE' index.html
          grep -q 'Ingresá solamente con tu celular' index.html
          ! grep -q 'Consultá con tu DNI' index.html
      - name: Commit
        run: |
          if git diff --quiet index.html; then exit 0; fi
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html
          git commit -m 'feat: migrate Club accounts to phone login'
          git push