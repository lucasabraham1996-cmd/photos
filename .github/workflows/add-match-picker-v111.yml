name: Add modern match picker v111

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_match_picker_v111.py'
      - '.github/workflows/add-match-picker-v111.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply match picker patch
        run: python3 scripts/add_match_picker_v111.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',s,re.S|re.I)
          for i,b in enumerate(blocks):
              if b.strip(): Path(f'/tmp/index-{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Verify match picker
        run: |
          grep -q 'v111-match-picker' index.html
          grep -q 'function MatchPickerModal' index.html
          grep -q 'Seleccionar partido' index.html
          grep -q 'matchPickerOpen' index.html
          grep -q 'v111-match-picker-styles' index.html
      - name: Commit match picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add modern match selector with team crests"
            git push origin HEAD:main
          fi
