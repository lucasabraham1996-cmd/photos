name: Apply v103 order recovery
on:
  push:
    paths:
      - '.github/scripts/apply_v103_order_recovery.py'
      - '.github/workflows/apply-v103-order-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply focused checkout fix
        run: python .github/scripts/apply_v103_order_recovery.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',html,re.S|re.I)
          n=0
          for attrs,body in scripts:
              if re.search(r'\bsrc\s*=',attrs,re.I) or not body.strip(): continue
              if re.search(r'\btype\s*=\s*["\x27]application/(?:json|ld\+json)',attrs,re.I): continue
              Path('/tmp/la-inline-'+str(n)+'.js').write_text(body,encoding='utf-8')
              n+=1
          print('Extracted',n,'inline scripts')
          PY
          for f in /tmp/la-inline-*.js; do node --check "$f"; done
      - name: Validate recovery markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'v103-order-recovery' in s
          assert 'const confirmed=status.firebase||status.script;' in s
          assert "'compactTransport'" in s
          assert 'El respaldo no confirmó el guardado' not in s
          assert 'await LAOrderOutbox.put(clean)' in s
          print('Recovery checks passed')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: recover checkout when order backup fails"
          git push
