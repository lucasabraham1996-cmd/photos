name: Apply specific opponents v115

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_specific_opponents_v115.py'
      - '.github/workflows/apply-specific-opponents-v115.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v115 patch
        run: python3 scripts/fix_specific_opponents_v115.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Verify exact opponent fixes
        run: |
          grep -q 'v115-specific-opponents' index.html
          grep -q 'union-florida.png?v=115' index.html
          grep -q 'Juvenil Barrio Comercial' index.html
          grep -q 'Escuela Parque Vélez Sarsfield' index.html
          grep -q 'special-green-fallback' index.html
      - name: Commit v115
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Union Florida Comercial and Parque Velez opponents"
            git push origin HEAD:main
          fi
