name: Apply v90 agenda status sort cleanup
on:
  push:
    paths:
      - '.github/scripts/apply_v90_agenda_status_sort_cleanup.py'
      - '.github/workflows/apply-v90-agenda-status-sort-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch agenda
        run: python3 .github/scripts/apply_v90_agenda_status_sort_cleanup.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate markers
        run: |
          grep -q 'booking.status-confirmado' contrataciones.html
          grep -q 'booking.status-realizado' contrataciones.html
          grep -q 'booking.status-cancelado' contrataciones.html
          grep -q 'purgeExpiredBookings' contrataciones.html
          grep -q '10\*24\*60\*60\*1000' contrataciones.html
          grep -q 'bm-am' contrataciones.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: color and clean agenda by match status'
          git push
