name: Apply v98 local LCF crests
on:
  push:
    paths:
      - '.github/scripts/apply_v98_local_lcf_crests.py'
      - '.github/workflows/apply-v98-local-lcf-crests.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contrataciones
        run: python3 .github/scripts/apply_v98_local_lcf_crests.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate teams and local PNGs
        run: |
          grep -q 'v98-local-lcf-crests' contrataciones.html
          ! grep -q "division:'Primera A'" contrataciones.html
          ! grep -q "division:'Primera B'" contrataciones.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          block=s.split('const LCF_TEAMS=[',1)[1].split('];',1)[0]
          paths=re.findall(r"logo:'(assets/lcf/[^']+\.png)'",block)
          assert len(paths)==42, len(paths)
          missing=[x for x in paths if not Path(x).exists()]
          assert not missing, missing
          assert all(Path(x).suffix.lower()=='.png' for x in paths)
          print('42 local PNG crests validated')
          PY
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use local transparent LCF crests in booking picker'
          git push
