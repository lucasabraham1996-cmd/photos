name: Fix v69 syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v69-syntax-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra parenthesis and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''                    !o.rejected && React.createElement("button", { onClick:() => { if (confirm('¿Marcar este pedido como cancelado/no pagado?')) setOrderDecisionAndClose(o,'rejected'); }, className:"bg-red-500/15 border border-red-500/30 text-red-200 px-3 py-2 rounded-xl text-xs font-black" }, "Anular / no pagado"))))),
            ),
            React.createElement("div", { id: "order-search-panel", className: "bg-neutral-900 border border-neutral-800 rounded-3xl p-5 mb-6" },'''
          new='''                    !o.rejected && React.createElement("button", { onClick:() => { if (confirm('¿Marcar este pedido como cancelado/no pagado?')) setOrderDecisionAndClose(o,'rejected'); }, className:"bg-red-500/15 border border-red-500/30 text-red-200 px-3 py-2 rounded-xl text-xs font-black" }, "Anular / no pagado"))))),
            React.createElement("div", { id: "order-search-panel", className: "bg-neutral-900 border border-neutral-800 rounded-3xl p-5 mb-6" },'''
          if old not in s:
              raise SystemExit('hotfix anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('v69-customer-benefits','v69-customer-benefits-hotfix',1)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/main.js').write_text(max(scripts,key=len),encoding='utf-8')
          PY
          node --check /tmp/main.js
      - name: Commit hotfix
        run: |
          git config user.name "lucasabraham1996-cmd"
          git config user.email "lucasabraham1996@gmail.com"
          git add index.html
          git commit -m "fix: restore app startup after v69 [v69-syntax-fixed]"
          git push
