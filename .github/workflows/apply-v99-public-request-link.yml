name: Apply v99 public request link
on:
  push:
    paths:
      - '.github/scripts/apply_v99_public_request_link.py'
      - '.github/workflows/apply-v99-public-request-link.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public request flow
        run: python3 .github/scripts/apply_v99_public_request_link.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('contrataciones.html').read_text(encoding='utf-8')
          i=s.find('<script>'); j=s.rfind('</script>')
          assert i>=0 and j>i
          Path('/tmp/contrataciones.js').write_text(s[i+8:j],encoding='utf-8')
          PY
          node --check /tmp/contrataciones.js
      - name: Validate public request flow
        run: |
          grep -q 'v99: link público permanente' contrataciones.html
          grep -q "function publicRequestUrl" contrataciones.html
          grep -q "function publicRequestPage" contrataciones.html
          grep -q "function submitPublicRequest" contrataciones.html
          grep -q "requestSource:'public'" contrataciones.html
          grep -q "status:'pendiente'" contrataciones.html
          grep -q "#/solicitar" contrataciones.html
          grep -q 'requestLinkBtn' contrataciones.html
          grep -q 'A definir' contrataciones.html
      - name: Commit
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add contrataciones.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add reusable public match request link'
          git push
