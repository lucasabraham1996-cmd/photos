name: Apply team identity cleanup v116

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_team_names_v116.py'
      - '.github/workflows/apply-team-identity-v116.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v116 patch
        run: python3 scripts/normalize_team_names_v116.py

      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', s, re.S | re.I)
          for i, block in enumerate(blocks):
              if block.strip():
                  Path(f'/tmp/index-{i}.js').write_text(block, encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do [ -f "$f" ] && node --check "$f"; done

      - name: Verify team identity fixes
        run: |
          grep -q 'v116-team-identity-cleanup' index.html
          grep -q "color:'#facc15'" index.html
          grep -q "name:'Juvenil Comercial'" index.html
          grep -q 'sp-ao.shortpixel.ai/client/to_webp' index.html
          grep -q 'function cleanTeamDisplayName' index.html
          grep -q 'TEAM_DISPLAY_NAME_OVERRIDES' index.html

      - name: Commit v116
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Correct team names colors and Parque Velez crest"
            git push origin HEAD:main
          fi
