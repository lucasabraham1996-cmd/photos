name: Apply v102 reliable orders
on:
  push:
    paths:
      - '.github/workflows/apply-v102-reliable-orders.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep large-order parts in the existing orders collection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/order-storage-v102.js')
          s=p.read_text(encoding='utf-8')
          old="ref.collection('payload').doc(String(i+n).padStart(6,'0'))"
          assert s.count(old)==2
          s=s.replace(old,"ref.parent.doc(ref.id+'__p'+String(i+n).padStart(6,'0'))")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply order persistence repair
        run: python3 .github/scripts/apply_v102_reliable_orders.py
      - name: Validate all classic inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Scripts(HTMLParser):
            def __init__(self): super().__init__();self.active=False;self.chunks=[];self.blocks=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs);self.active='src' not in a and a.get('type','text/javascript') in ('text/javascript','application/javascript','module','')
                self.chunks=[]
            def handle_data(self,data):
              if self.active:self.chunks.append(data)
            def handle_endtag(self,tag):
              if tag=='script':
                if self.active:self.blocks.append(''.join(self.chunks))
                self.active=False
          parser=Scripts();parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert parser.blocks
          for i,block in enumerate(parser.blocks):
            if not block.strip():continue
            path=Path('/tmp/la-inline-%d.js'%i);path.write_text(block,encoding='utf-8')
            subprocess.run(['node','--check',str(path)],check=True)
          print('PASS: all classic inline scripts parse')
          PY
      - name: Test large orders, retries and source merging
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const vm=require('node:vm');
          const source=fs.readFileSync('.github/scripts/order-storage-v102.js','utf8');
          const core=vm.runInNewContext(source+'\nLAOrderStorage',{TextEncoder,Math,JSON,Number,String,Array,Set,Map,Promise,Error,globalThis:{},localStorage:{getItem:()=>null,setItem:()=>{}}});
          const docs=new Map();let writes=0,failAt=-1;
          function ref(path){return {id:path.split('/').pop(),parent:{doc(id){return ref(path.slice(0,path.lastIndexOf('/'))+'/'+id)}},async get(){return {exists:docs.has(path),data:()=>docs.get(path)}},async set(value,opts){if(++writes===failAt)throw Error('network');docs.set(path,opts?.merge?{...docs.get(path),...value}:value)}}}
          const db={collection(n){return {doc(id){return ref(n+'/'+id)}}}};
          const key=id=>id.replace(/[^A-Z0-9]/gi,'');
          const make=n=>({id:'LA-TEST'+n,date:'2026-09-06T20:00:00Z',status:'pendiente',delivered:false,total:n*2000,items:Array.from({length:n},(_,i)=>({id:'photo-'+i,albumName:'Álbum',name:'foto '+i,code:'F'+i,url:'https://example.com/'+i+'?x='+('z'.repeat(120)),price:2000,printRequested:i%3===0})),printedPhotoIds:Array.from({length:n},(_,i)=>i).filter(i=>i%3===0).map(i=>'photo-'+i),printCount:Math.ceil(n/3)});
          (async()=>{
            for(const n of [1,24,500,2000]){const o=make(n);assert.equal(await core.persist(db,'orders',o,key),true);const found=await core.read(db,'orders',o.id,key);assert.equal(found.items.length,n);assert.deepEqual(Array.from(found.printedPhotoIds),o.printedPhotoIds);assert.equal(await core.persist(db,'orders',o,key),true);console.log('PASS round-trip and idempotent retry: '+n+' photos')}
            const o=make(900);failAt=writes+2;await assert.rejects(core.persist(db,'orders',o,key));failAt=-1;assert.equal(await core.persist(db,'orders',o,key),true);assert.equal((await core.read(db,'orders',o.id,key)).items.length,900);console.log('PASS interrupted upload recovery');
            docs.get('orders/'+key(o.id)).status='entregado';docs.get('orders/'+key(o.id)).delivered=true;assert.equal(await core.persist(db,'orders',o,key),true);assert.equal((await core.read(db,'orders',o.id,key)).delivered,true);console.log('PASS delivered status preserved');
            assert.equal(core.verifiedAck({ok:false},o.id,key),false);assert.equal(core.verifiedAck({ok:true,id:'OTHER'},o.id,key),false);assert.equal(core.verifiedAck({ok:true,id:o.id},o.id,key),true);console.log('PASS acknowledgement validation');
            const bad=make(700);await core.persist(db,'orders',bad,key);docs.delete('orders/'+key(bad.id)+'__p000000');await assert.rejects(core.read(db,'orders',bad.id,key));await core.persist(db,'orders',bad,key);console.log('PASS missing chunk detection and repair');
            const html=fs.readFileSync('index.html','utf8');
            function extract(a,b){const i=html.indexOf(a),j=html.indexOf(b,i+a.length);assert(i>=0&&j>i);return html.slice(i,j).trim()}
            const local=[],pending=[],queue=new Map(),calls=[];
            const merge=(...lists)=>{const m=new Map();lists.flat().forEach(o=>{if(o)m.set(o.id,o)});return [...m.values()]};
            let primaryFails=false,scriptReply={ok:false};
            const ctx={LA_ORDER_SAVE_INFLIGHT:new Map(),LAOrderOutbox:{async put(o){queue.set(o.id,o)},async remove(id){queue.delete(id)},async all(){return [...queue.values()]}},saveLocalOrders:rows=>{local.splice(0,local.length,...rows)},readLocalOrders:()=>local,savePendingOrders:rows=>{pending.splice(0,pending.length,...rows)},readPendingOrders:()=>pending,mergeOrders:merge,normalizeOrderCode:key,sameOrderCode:(a,b)=>key(a)===key(b),saveOrderFirebase:async()=>{if(primaryFails)throw Error('network');return true},orderDeadline:p=>p,compactOrderForScript:o=>o,URLSearchParams,apiAction:async p=>{calls.push(p.action);return p.action==='createOrder'?scriptReply:{order:make(24)}},LAOrderStorage:core,window:{},APP_VERSION:'test',ORDERS_COLLECTION_PATH:'orders',console,Date,Promise,Map,Math,JSON,Number,String,Array,Set};
            const save=vm.runInNewContext('('+extract('async function saveOrderRemote(order)','async function loadOrdersRemote()')+')',ctx);
            const good=make(1);assert.equal((await save(good)).firebase,true);assert.equal(queue.size,0);assert.equal(calls.length,0);
            primaryFails=true;const failed=make(24);const result=await save(failed);assert.equal(result.firebase||result.script,false);assert.equal(queue.has(failed.id),true);
            scriptReply={ok:true,id:failed.id};const recovered=await save(failed);assert.equal(recovered.script,true);assert.equal(queue.has(failed.id),false);console.log('PASS failed writes stay recoverable; verified backup clears queue');
            const loadCtx={apiAction:async()=>({orders:[{id:'S',items:[]}]}),loadOrdersFirebase:async()=>[{id:'F',items:[]}],mergeOrders:merge,normalizeOrderCode:key,readLocalOrders:()=>[],readPendingOrders:()=>[],LAOrderOutbox:ctx.LAOrderOutbox,window:{},Promise,Map,Array,Number};
            const load=vm.runInNewContext('('+extract('async function loadOrdersRemote()','async function markOrderDelivered(')+')',loadCtx);
            assert.equal((await load()).length,2);console.log('PASS Admin merges both remote sources');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Validate repair markers
        run: |
          grep -q 'v102-reliable-orders' index.html
          grep -q 'LAOrderStorage.persist' index.html
          grep -q 'LAOrderStorage.hydrate' index.html
          grep -q 'LAOrderOutbox.put' index.html
          grep -q 'safeOrderWhatsappUrl' index.html
          grep -q 'checkoutSaveError' index.html
          grep -q 'orderDeadline' index.html
      - name: Commit functional changes
        run: |
          git config user.name 'lucasabraham1996-cmd'
          git config user.email 'lucasabraham1996@gmail.com'
          git add index.html .github/scripts/order-storage-v102.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist and recover large photo orders reliably'
          git push
