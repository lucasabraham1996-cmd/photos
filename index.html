<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lucasabraham.ph - Galería de Clientes</title>
    
    <!-- Tailwind CSS para Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos base adicionales */
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0a0a0a; color: white; }
        .glass-effect { background: rgba(23, 23, 23, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Evitar selección de imágenes para seguridad básica */
        img { -webkit-user-drag: none; user-select: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Importar Firebase modularmente desde el CDN oficial de Google
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';

        const { useState, useRef, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAznAxOW-leFrKw3tIjRV5vilIjvRKsgk0",
            authDomain: "lucasabraham-b84aa.firebaseapp.com",
            projectId: "lucasabraham-b84aa",
            storageBucket: "lucasabraham-b84aa.firebasestorage.app",
            messagingSenderId: "1057661064112",
            appId: "1:1057661064112:web:6952c87bd6a5388c0e3c75",
            measurementId: "G-NPYNZQ0MPQ"
        };

        let db = null;
        let auth = null;
        const appId = 'lucasabraham-ph-db';

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.warn("Error inicializando Firebase:", error);
        }

        // --- LÓGICA DE PRECIOS INTELIGENTE ---
        const calculateBestPrice = (count) => {
            if (count === 0) return 0;
            if (count >= 10) return Math.floor(count / 10) * 10000 + calculateBestPrice(count % 10);
            if (count >= 5) {
                const price = 7500 + calculateBestPrice(count - 5);
                return Math.min(price, 10000); 
            }
            if (count >= 3) {
                const price = 5000 + calculateBestPrice(count - 3);
                return Math.min(price, 7500); 
            }
            const price = count * 2000;
            return Math.min(price, 5000); 
        };

        // Formateador exacto para Pesos Argentinos (Ej: $10.000)
        const formatPrice = (price) => {
            return "$" + new Intl.NumberFormat('es-AR').format(price);
        };

        function App() {
            const [route, setRoute] = useState(window.location.hash || '#/galeria');
            const [photos, setPhotos] = useState([]);
            const [albums, setAlbums] = useState([{ id: 'default', name: 'General', cover: null }]);
            const [activeAlbum, setActiveAlbum] = useState(null); 
            const [orders, setOrders] = useState([]); 
            
            const [cart, setCart] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            
            const [sellerPhone, setSellerPhone] = useState('3515580770');
            const [watermarkImg, setWatermarkImg] = useState(null);
            
            const [searchOrderInput, setSearchOrderInput] = useState('');
            const [foundOrder, setFoundOrder] = useState(null);

            const fileInputRef = useRef(null);
            const ADMIN_PIN = '1234'; 
            const MAX_STORAGE_MB = 50; 

            useEffect(() => {
                const handleHashChange = () => setRoute(window.location.hash || '#/galeria');
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => setWatermarkImg(img);
                img.onerror = () => console.warn("No se pudo cargar el logo para la marca de agua.");
                img.src = 'https://i.postimg.cc/PrD4jg9V/Logo-LA.png';
            }, []);

            useEffect(() => {
                if (!auth || !db) return;
                const initAuth = async () => {
                    try { await signInAnonymously(auth); } catch (error) { console.warn("Modo anónimo falló, continuando con permisos públicos.", error); }
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!db) return;
                
                const photosCol = collection(db, 'artifacts', appId, 'photos');
                const unsubPhotos = onSnapshot(photosCol, (snapshot) => {
                    setPhotos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                
                const albumsCol = collection(db, 'artifacts', appId, 'albums');
                const unsubAlbums = onSnapshot(albumsCol, (snapshot) => {
                    if (!snapshot.empty) setAlbums(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                
                const ordersCol = collection(db, 'artifacts', appId, 'orders');
                const unsubOrders = onSnapshot(ordersCol, (snapshot) => {
                    setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                return () => { unsubPhotos(); unsubAlbums(); unsubOrders(); };
            }, []);

            const storageUsedMB = useMemo(() => {
                let bytes = 0;
                photos.forEach(p => { bytes += p.url ? p.url.length : 0; });
                return (bytes / (1024 * 1024)).toFixed(2);
            }, [photos]);

            const storagePercentage = Math.min((storageUsedMB / MAX_STORAGE_MB) * 100, 100);

            const processImage = (file, albumId) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_DIMENSION = 800; 
                            let width = img.width;
                            let height = img.height;

                            if (width > height && width > MAX_DIMENSION) {
                                height *= MAX_DIMENSION / width; width = MAX_DIMENSION;
                            } else if (height > MAX_DIMENSION) {
                                width *= MAX_DIMENSION / height; height = MAX_DIMENSION;
                            }

                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            if (watermarkImg) {
                                const wmWidth = width * 0.6; 
                                const wmRatio = watermarkImg.height / watermarkImg.width;
                                const wmHeight = wmWidth * wmRatio;
                                ctx.globalAlpha = 0.5; 
                                ctx.drawImage(watermarkImg, (width - wmWidth) / 2, (height - wmHeight) / 2, wmWidth, wmHeight);
                                ctx.globalAlpha = 1.0;
                            }

                            try {
                                const watermarkedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                                resolve({ albumId, name: file.name, url: watermarkedDataUrl, timestamp: Date.now() });
                            } catch (err) {
                                resolve(null);
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleFileUpload = async (e) => {
                if (!activeAlbum) { alert("Por favor selecciona un álbum primero."); return; }
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setIsProcessing(true);
                try {
                    const processed = await Promise.all(files.map(f => processImage(f, activeAlbum)));
                    const validPhotos = processed.filter(p => p !== null);

                    if (db) {
                        const photosCol = collection(db, 'artifacts', appId, 'photos');
                        for (const photo of validPhotos) { await addDoc(photosCol, photo); }
                    }
                    
                    const currentAlbum = albums.find(a => a.id === activeAlbum);
                    if (currentAlbum && !currentAlbum.cover && validPhotos.length > 0) {
                        if(db) await setDoc(doc(db, 'artifacts', appId, 'albums', activeAlbum), { cover: validPhotos[0].url }, { merge: true });
                    }
                } catch (error) {
                    alert("Hubo un error procesando las imágenes.");
                } finally {
                    setIsProcessing(false);
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const createNewAlbum = async () => {
                const name = prompt("Nombre del nuevo álbum:");
                if (!name) return;
                const newAlbum = { id: Math.random().toString(36).substr(2, 9), name, cover: null };
                if (db) await setDoc(doc(db, 'artifacts', appId, 'albums', newAlbum.id), newAlbum);
            };

            const removePhoto = async (id) => {
                if (db) await deleteDoc(doc(db, 'artifacts', appId, 'photos', id));
                setCart(cart.filter(itemId => itemId !== id));
            };

            const toggleCart = (id) => setCart(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);

            const handleShareClientLink = () => {
                const clientUrl = window.location.origin + window.location.pathname;
                navigator.clipboard.writeText(clientUrl).then(() => {
                    setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000);
                }).catch(err => {
                    // Fallback
                    const textArea = document.createElement("textarea");
                    textArea.value = clientUrl; document.body.appendChild(textArea); textArea.select();
                    document.execCommand('copy'); document.body.removeChild(textArea);
                    setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000);
                });
            };

            const currentPrice = useMemo(() => calculateBestPrice(cart.length), [cart.length]);
            const regularPrice = cart.length * 2000;
            const savings = regularPrice - currentPrice;

            const handleCheckout = async () => {
                if (cart.length === 0) return;
                
                const orderId = 'LA-' + Math.floor(10000 + Math.random() * 90000);
                const selectedPhotos = photos.filter(p => cart.includes(p.id));
                
                const newOrder = {
                    id: orderId, date: new Date().toISOString(), total: currentPrice,
                    items: selectedPhotos.map(p => ({ id: p.id, originalName: p.name }))
                };

                if (db) await setDoc(doc(db, 'artifacts', appId, 'orders', orderId), newOrder);

                let message = `📸 *NUEVO PEDIDO DE FOTOS*\n\nHola Lucas! Te adjunto mi comprobante de pago.\n\n`;
                message += `📋 *NÚMERO DE OPERACIÓN:* #${orderId}\n`;
                message += `💰 *TOTAL PAGADO:* ${formatPrice(currentPrice)}\n\n`;
                message += `_Cantidad de fotos: ${cart.length}_`;

                window.open(`https://wa.me/${sellerPhone}?text=${encodeURIComponent(message)}`, '_blank');
                setCart([]); 
            };

            const searchOrder = (e) => {
                e.preventDefault();
                const order = orders.find(o => o.id.toUpperCase() === searchOrderInput.toUpperCase());
                setFoundOrder(order || 'NOT_FOUND');
            };

            const AdminLogin = () => (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-neutral-900 border border-neutral-800 p-8 rounded-3xl shadow-2xl fade-in">
                        <div className="w-16 h-16 bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-6 text-indigo-400">
                            <i className="fas fa-lock text-2xl"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-white text-center mb-2">Acceso Protegido</h2>
                        <p className="text-neutral-400 text-center mb-8 text-sm">Ingresa el PIN para administrar la galería.</p>
                        
                        <form onSubmit={(e) => {
                            e.preventDefault();
                            if (pinInput === ADMIN_PIN) setIsAdminUnlocked(true);
                            else { alert("PIN Incorrecto"); setPinInput(''); }
                        }}>
                            <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="••••" className="w-full bg-neutral-950 border border-neutral-700 text-white text-center text-2xl tracking-[0.5em] p-4 rounded-xl focus:border-indigo-500 outline-none mb-4" autoFocus />
                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 rounded-xl transition-colors flex justify-center items-center gap-2">
                                <i className="fas fa-unlock"></i> Desbloquear Panel
                            </button>
                        </form>
                    </div>
                </div>
            );

            const AdminDashboard = () => {
                const clientUrl = window.location.origin + window.location.pathname;
                const adminUrl = window.location.origin + window.location.pathname + '#/admin';

                return (
                <div className="min-h-screen text-neutral-200 pb-20 fade-in">
                    <div className="max-w-7xl mx-auto p-6 lg:p-8">
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-8 border-b border-neutral-800 pb-6 gap-4">
                            <div>
                                <h1 className="text-3xl font-light text-white tracking-tight mb-2">Panel de <span className="font-bold text-indigo-400">lucasabraham.ph</span></h1>
                                <p className="text-neutral-500">Administra tus archivos y visualiza tu galería.</p>
                            </div>
                            <button onClick={() => window.location.hash = '#/galeria'} className="text-sm bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded-lg transition text-white">
                                Ver como Cliente <i className="fas fa-arrow-right ml-1"></i>
                            </button>
                        </header>

                        <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl mb-8 shadow-lg">
                            <h3 className="text-white font-medium mb-4 flex items-center gap-2"><i className="fas fa-share-nodes text-neutral-400"></i> Tus Enlaces de Acceso</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-xs text-neutral-500 mb-1 uppercase tracking-wider">Link para Clientes (Compartir)</label>
                                    <div className="flex gap-2">
                                        <input type="text" readOnly value={clientUrl} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-300 outline-none" />
                                        <button onClick={handleShareClientLink} className={`px-4 py-2 rounded-lg text-sm transition flex-shrink-0 text-white ${copySuccess ? 'bg-emerald-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                                            {copySuccess ? '¡Copiado!' : 'Copiar Link'}
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs text-neutral-500 mb-1 uppercase tracking-wider">Link de Administrador (Guárdalo)</label>
                                    <input type="text" readOnly value={adminUrl} className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-neutral-500 outline-none" />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-8">
                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
                                    <h3 className="text-white font-medium mb-4 flex items-center gap-2"><i className="fas fa-database text-neutral-400"></i> Almacenamiento Local</h3>
                                    <div className="w-full bg-neutral-950 rounded-full h-3 mb-2 border border-neutral-800 overflow-hidden">
                                        <div className={`h-full rounded-full transition-all ${storagePercentage > 80 ? 'bg-red-500' : 'bg-indigo-500'}`} style={{ width: `${storagePercentage}%` }}></div>
                                    </div>
                                    <div className="flex justify-between text-xs text-neutral-500 mb-4">
                                        <span>{storageUsedMB} MB usados</span>
                                        <span>{MAX_STORAGE_MB} MB max</span>
                                    </div>
                                    <p className="text-[11px] text-neutral-600 leading-tight">La app comprime las fotos para ahorrar espacio en la BD.</p>
                                </div>

                                <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl">
                                    <h3 className="text-white font-medium mb-4 flex items-center gap-2"><i className="fas fa-search text-emerald-400"></i> Buscar Operación</h3>
                                    <form onSubmit={searchOrder} className="flex gap-2 mb-4">
                                        <input type="text" value={searchOrderInput} onChange={(e) => setSearchOrderInput(e.target.value)} placeholder="Ej: LA-12345" className="w-full bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-sm text-white outline-none uppercase" />
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 rounded-lg"><i className="fas fa-search"></i></button>
                                    </form>
                                    
                                    {foundOrder === 'NOT_FOUND' && <p className="text-red-400 text-xs">Operación no encontrada.</p>}
                                    {foundOrder && foundOrder !== 'NOT_FOUND' && (
                                        <div className="bg-neutral-950 border border-emerald-900/50 p-4 rounded-xl mt-2">
                                            <p className="text-emerald-400 font-bold mb-1"><i className="fas fa-check-circle mr-1"></i> Operación Válida</p>
                                            <p className="text-xs text-neutral-400 mb-2">Archivos originales para enviar:</p>
                                            <ul className="text-xs text-white space-y-1 max-h-32 overflow-y-auto font-mono bg-neutral-900 p-2 rounded border border-neutral-800">
                                                {foundOrder.items.map(i => <li key={i.id}>• {i.originalName}</li>)}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="lg:col-span-3">
                                {activeAlbum === null ? (
                                    <div>
                                        <div className="flex justify-between items-center mb-6">
                                            <h2 className="text-2xl font-light text-white">Tus Álbumes</h2>
                                            <button onClick={createNewAlbum} className="flex items-center gap-2 bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-lg text-sm transition border border-neutral-700">
                                                <i className="fas fa-plus"></i> Crear Álbum
                                            </button>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                                            {albums.map(album => (
                                                <div key={album.id} onClick={() => setActiveAlbum(album.id)} className="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden cursor-pointer hover:border-indigo-500/50 transition group shadow-md">
                                                    <div className="h-40 bg-neutral-950 relative flex items-center justify-center">
                                                        {album.cover ? (
                                                            <img src={album.cover} alt="Cover" className="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition" />
                                                        ) : (
                                                            <i className="fas fa-folder-open text-4xl text-neutral-800"></i>
                                                        )}
                                                        <div className="absolute inset-0 bg-gradient-to-t from-neutral-900 via-transparent to-transparent"></div>
                                                    </div>
                                                    <div className="p-4 flex items-center gap-3">
                                                        <i className="fas fa-folder text-indigo-400"></i>
                                                        <h3 className="font-medium text-white">{album.name}</h3>
                                                        <span className="ml-auto text-xs text-neutral-500 bg-neutral-800 px-2 py-1 rounded-md">{photos.filter(p => p.albumId === album.id).length} fotos</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="fade-in">
                                        <div className="flex items-center gap-4 mb-8 pb-4 border-b border-neutral-800">
                                            <button onClick={() => setActiveAlbum(null)} className="text-neutral-400 hover:text-white bg-neutral-900 p-2 rounded-lg"><i className="fas fa-arrow-left"></i></button>
                                            <h2 className="text-2xl font-light text-white flex items-center gap-2">
                                                <i className="fas fa-folder-open text-indigo-400"></i> {albums.find(a => a.id === activeAlbum)?.name}
                                            </h2>
                                        </div>

                                        <div className="border-2 border-dashed border-neutral-800 hover:border-indigo-500/50 rounded-3xl p-10 text-center bg-neutral-900/50 transition cursor-pointer mb-8 group" onClick={() => !isProcessing && fileInputRef.current.click()}>
                                            <input type="file" multiple accept="image/*" className="hidden" ref={fileInputRef} onChange={handleFileUpload} disabled={isProcessing} />
                                            {isProcessing ? (
                                                <div className="flex flex-col items-center justify-center space-y-3">
                                                    <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                                                    <p className="text-indigo-400 text-sm">Protegiendo con Marca de Agua...</p>
                                                </div>
                                            ) : (
                                                <div className="flex flex-col items-center justify-center space-y-3 opacity-70 group-hover:opacity-100">
                                                    <div className="bg-neutral-800 p-4 rounded-full"><i className="fas fa-cloud-arrow-up text-xl text-neutral-300"></i></div>
                                                    <p className="text-white font-medium">Subir fotos a este álbum</p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            {photos.filter(p => p.albumId === activeAlbum).map(photo => (
                                                <div key={photo.id} className="group relative rounded-xl overflow-hidden bg-neutral-900 aspect-square">
                                                    <img src={photo.url} alt="Protegida" className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition" />
                                                    <button onClick={() => removePhoto(photo.id)} className="absolute top-2 right-2 bg-red-500/90 text-white p-2 rounded-lg opacity-0 group-hover:opacity-100 transition backdrop-blur-sm">
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
                );
            };

            const ClientGallery = () => (
                <div className="min-h-screen pb-40 fade-in selection:bg-indigo-500/30">
                    <div className="max-w-4xl mx-auto pt-8 sm:pt-12 pb-6 px-4 sm:px-8">
                        <div className="flex items-start sm:items-center gap-6 sm:gap-10 mb-6">
                            <div className="relative flex-shrink-0">
                                <div className="w-24 h-24 sm:w-36 sm:h-36 rounded-full p-[3px] bg-gradient-to-tr from-yellow-500 via-pink-500 to-indigo-500 flex items-center justify-center shadow-xl">
                                    <div className="w-full h-full rounded-full border-4 border-[#0a0a0a] overflow-hidden bg-neutral-900 flex items-center justify-center">
                                        <img src="https://i.postimg.cc/PrD4jg9V/Logo-LA.png" alt="lucasabraham.ph" className="w-[70%] h-[70%] object-contain" />
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 pt-2 sm:pt-0">
                                <div className="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 mb-4">
                                    <h2 className="text-2xl font-semibold text-white">lucasabraham.ph</h2>
                                    <button onClick={() => window.open(`https://wa.me/${sellerPhone}`, '_blank')} className="bg-neutral-800 hover:bg-neutral-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition w-full sm:w-auto text-center border border-neutral-700">
                                        Contactar
                                    </button>
                                </div>
                                <div className="flex gap-8 mb-4">
                                    <div className="text-white text-sm"><span className="font-bold text-lg">{albums.length}</span> álbumes</div>
                                    <div className="text-white text-sm"><span className="font-bold text-lg">{photos.length}</span> fotos</div>
                                </div>
                                <div className="hidden sm:block">
                                    <p className="font-semibold text-white mb-1">Lucas Abraham | Fotografía</p>
                                    <p className="text-neutral-400 text-sm leading-relaxed">
                                        📸 Galería privada para clientes.<br/>
                                        💳 Elegí tus fotos favoritas y enviá el comprobante.<br/>
                                        💎 Packs: 3x$5k | 5x$7.5k | 10x$10k
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div className="sm:hidden mb-6 px-2">
                            <p className="font-semibold text-white mb-1">Lucas Abraham | Fotografía</p>
                            <p className="text-neutral-400 text-sm leading-relaxed">
                                📸 Galería privada para clientes.<br/>
                                💳 Elegí tus fotos favoritas y enviá el comprobante.<br/>
                                💎 Packs: 3x$5k | 5x$7.5k | 10x$10k
                            </p>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto flex justify-center border-t border-neutral-900 mb-8">
                        <div className="flex items-center gap-2 border-t border-white pt-4 pb-2 px-4 -mt-[1px]">
                            <i className="fas fa-border-all text-xs"></i>
                            <span className="text-xs font-semibold text-white uppercase tracking-widest">Galería</span>
                        </div>
                    </div>

                    <div className="max-w-[1400px] mx-auto px-4 md:px-8">
                        {activeAlbum === null ? (
                            <div>
                                <h2 className="text-xl text-white mb-6 font-light flex items-center gap-2"><i className="fas fa-folder-open text-indigo-400"></i> Álbumes Disponibles</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                    {albums.map(album => (
                                        <div key={album.id} onClick={() => setActiveAlbum(album.id)} className="group cursor-pointer">
                                            <div className="aspect-[4/3] rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800 mb-3 relative shadow-lg group-hover:border-indigo-500/50 transition-all">
                                                {album.cover ? (
                                                    <img src={album.cover} alt="Cover" className="w-full h-full object-cover opacity-70 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500" />
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center"><i className="fas fa-images text-4xl text-neutral-800"></i></div>
                                                )}
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent opacity-80"></div>
                                                <div className="absolute bottom-4 left-4 right-4">
                                                    <h3 className="text-white font-medium text-lg shadow-sm">{album.name}</h3>
                                                </div>
                                            </div>
                                            <p className="text-neutral-400 text-sm px-2">{photos.filter(p => p.albumId === album.id).length} fotos</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="fade-in">
                                <button onClick={() => setActiveAlbum(null)} className="flex items-center gap-2 text-neutral-400 hover:text-white mb-8 transition bg-neutral-900 px-5 py-2.5 rounded-full w-fit border border-neutral-800 text-sm">
                                    <i className="fas fa-arrow-left"></i> Volver a Álbumes
                                </button>
                                
                                {photos.filter(p => p.albumId === activeAlbum).length === 0 ? (
                                    <p className="text-center text-neutral-500 py-20">Este álbum aún no tiene fotos.</p>
                                ) : (
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-6">
                                        {photos.filter(p => p.albumId === activeAlbum).map(photo => {
                                            const isSelected = cart.includes(photo.id);
                                            return (
                                                <div key={photo.id} onClick={() => toggleCart(photo.id)} className={`relative rounded-2xl overflow-hidden aspect-[4/5] cursor-pointer transition-all duration-300 select-none ${isSelected ? 'ring-2 ring-indigo-500 scale-[0.96] shadow-[0_0_20px_rgba(99,102,241,0.3)]' : 'hover:opacity-90 bg-neutral-900 border border-neutral-800'}`}>
                                                    <img src={photo.url} alt="Foto" className="w-full h-full object-cover pointer-events-none" />
                                                    <div className={`absolute inset-0 transition-colors duration-300 ${isSelected ? 'bg-indigo-900/40' : 'bg-transparent'}`}></div>
                                                    <div className={`absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300 z-10 ${isSelected ? 'bg-indigo-500 text-white scale-110 shadow-lg' : 'bg-black/50 text-white/30 border border-white/20 backdrop-blur-sm'}`}>
                                                        {isSelected && <i className="fas fa-check"></i>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {cart.length > 0 && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-2xl z-50 fade-in">
                            <div className="glass-effect border border-white/10 rounded-3xl p-4 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-4 w-full sm:w-auto">
                                    <div className="bg-indigo-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/20">{cart.length}</div>
                                    <div className="flex-1">
                                        <div className="flex items-baseline gap-2">
                                            <p className="text-2xl font-bold text-white">{formatPrice(currentPrice)}</p>
                                            {savings > 0 && <p className="text-sm text-neutral-500 line-through">{formatPrice(regularPrice)}</p>}
                                        </div>
                                        {savings > 0 ? <p className="text-xs font-medium text-emerald-400">¡Promo aplicada!</p> : <p className="text-xs text-neutral-400">Packs: 3x$5k | 5x$7.5k | 10x$10k</p>}
                                    </div>
                                </div>
                                <div className="flex gap-2 w-full sm:w-auto">
                                    <button onClick={() => setCart([])} className="px-4 py-3 text-neutral-400 font-medium hover:text-white bg-white/5 rounded-xl transition text-sm flex-1 sm:flex-none">Vaciar</button>
                                    <button onClick={handleCheckout} className="bg-white hover:bg-neutral-200 text-black px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition flex-1 sm:flex-none">
                                        <i className="fas fa-file-invoice"></i> Comprar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            if (route === '#/admin') {
                return isAdminUnlocked ? AdminDashboard() : AdminLogin();
            }
            return ClientGallery();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
