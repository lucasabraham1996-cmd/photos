<script id="la-v67-photo-protection">
(function(){
  'use strict';

  function protectedArea(target){
    return !!(target && target.closest && target.closest('.photo-viewer-lock,.mosaic-tile'));
  }

  /* Context menu / long-click desktop and Android */
  document.addEventListener('contextmenu',function(e){
    if(protectedArea(e.target) || (e.target && e.target.tagName === 'IMG')){
      e.preventDefault();
      e.stopPropagation();
    }
  },true);

  document.addEventListener('dragstart',function(e){
    if(protectedArea(e.target) || (e.target && e.target.tagName === 'IMG')){
      e.preventDefault();
      e.stopPropagation();
    }
  },true);

  /* iOS Safari:
     No cancelamos touchstart. Esto mantiene funcionando el scroll vertical,
     el tap para abrir fotos y el swipe del visor. La protección se conserva
     con contextmenu, dragstart y las reglas CSS de las imágenes. */

  function hardenImages(root){
    var scope=(root && root.querySelectorAll)?root:document;
    scope.querySelectorAll('img').forEach(function(img){
      img.setAttribute('draggable','false');
      img.draggable=false;
      img.style.webkitUserDrag='none';
      img.style.webkitTouchCallout='none';
      img.style.webkitUserSelect='none';
      img.style.userSelect='none';
    });
  }
  hardenImages(document);
  try{
    new MutationObserver(function(records){
      records.forEach(function(record){
        record.addedNodes.forEach(function(node){
          if(node && node.nodeType===1) hardenImages(node);
        });
      });
    }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
</script>
