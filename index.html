async function saveOrderRemote(order){

async function loadOrdersRemote(){

const formatPrice=(p)=>"$"+new Intl.NumberFormat("es-AR").format(Number(p||0));
const norm=(v)=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const pick=(row,keys)=>{const map={};Object.keys(row||{}).forEach(k=>map[norm(k)]=row[k]);for(const k of keys){const v=map[norm(k)];if(v!==undefined&&String(v).trim()!=="")return String(v).trim()}return""};
const priceNum=(v)=>Number(String(v||"").replace(/[^0-9]/g,""))||0;
const discountRate=(count)=>count>=10?0.20:count>=5?0.15:count>=3?0.10:0;
const calculateSubtotal=(items)=>items.reduce((sum,p)=>sum+(Number(p.price)||0),0);
const calculateBestPrice=(items)=>Math.round(calculateSubtotal(items)*(1-discountRate(items.length)));
const extractDriveId=(url)=>{const s=String(url||"");const patterns=[/drive\.google\.com\/file\/d\/([^/]+)/,/drive\.google\.com\/open\?id=([^&]+)/,/drive\.google\.com\/uc\?[^#]*id=([^&]+)/,/[?&]id=([^&]+)/];for(const p of patterns){const m=s.match(p);if(m&&m[1])return decodeURIComponent(m[1])}return""};
const toImgUrl=(url,size=500)=>{const raw=String(url||"").trim();if(!raw)return"";if(raw.startsWith("data:image/"))return raw;const id=extractDriveId(raw);if(id)return`https://drive.google.com/thumbnail?id=${id}&sz=w${size}`;return raw};
const cleanOperationCode=(v)=>String(v||"").trim().replace(/^#/g,"").toUpperCase();
const orderDriveLink=(item)=>item.driveLink||item.rawUrl||item.originalUrl||item.url||"";
const yes=(v)=>["si","sí","yes","true","1","portada","cover"].includes(norm(v));
const safeCode=(name)=>String(name||"").split(".")[0].slice(0,20).toUpperCase().replace(/[^A-Z0-9]+/g,"").slice(-6)||Math.random().toString(36).slice(2,8).toUpperCase();
const albumHash=(albumId)=>`#/album/${encodeURIComponent(albumId)}`;
const albumUrl=(albumId)=>`${location.origin}${location.pathname}${albumHash(albumId)}`;
const getAlbumIdFromHash=(hash)=>{const h=String(hash||"");const m=h.match(/^#\/album\/(.+)$/);return m?decodeURIComponent(m[1]):null};

function parseAlbumDate(v){
  const s=String(v||"").trim();
  if(!s)return null;
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){const y=Number(m[3].length===2?"20"+m[3]:m[3]);return new Date(y,Number(m[2])-1,Number(m[1])).getTime()}
  const t=Date.parse(s);
  return Number.isNaN(t)?null:t;
}
function formatAlbumDate(ts){
  if(!ts)return "";
  return new Intl.DateTimeFormat("es-AR",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(ts)).replace(".","");
}
function getAlbumDateFromRows(rows){
  for(const r of rows||[]){
    const raw=pick(r,["fecha","date","día","dia","fecha album","fecha_album","evento fecha","fecha evento"]);
    if(raw){const ts=parseAlbumDate(raw);if(ts)return ts}
  }
  return 0;
}

const looksLikeImageUrl=(v)=>{const s=String(v||"").trim();return /^https?:\/\//i.test(s)&&(/drive\.google\.com|googleusercontent|postimg|imgur|cloudinary|firebasestorage|\.jpg|\.jpeg|\.png|\.webp|\.gif/i.test(s));};
const findAnyImageUrl=(row)=>{const direct=pick(row,["url","imagen","image","foto","preview","link","enlace","archivo","photo","src","miniatura","thumbnail"]);if(looksLikeImageUrl(direct))return direct;const vals=Object.values(row||{});return vals.find(looksLikeImageUrl)||""};

function jsonp(url){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);const sep=url.includes("?")?"&":"?";const script=document.createElement("script");let done=false;const timer=setTimeout(()=>{if(done)return;done=true;delete window[cb];script.remove();reject(new Error("No respondió la fuente de datos"));},15000);window[cb]=(data)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();resolve(data)};script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();reject(new Error("No se pudo cargar la fuente de datos"))};script.src=`${url}${sep}callback=${cb}`;document.body.appendChild(script)})}

async function gvizJsonpForFirstSheet(){
  const base=FALLBACK_PUBLISHED_SHEET_URL.replace(/pub\?output=csv/i,'gviz/tq?tqx=out:json');
  const txt=await fetch(base).then(r=>r.text());
  const m=txt.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
  if(!m)throw new Error("Google Sheets bloqueó la lectura directa. Usá Apps Script.");
  const obj=JSON.parse(m[1]);
  const cols=(obj.table.cols||[]).map(c=>c.label||c.id||"");
  const rows=(obj.table.rows||[]).map(r=>{const out={};(r.c||[]).forEach((c,i)=>out[cols[i]]=c&&c.v!==undefined?c.v:"");return out});
  return {ok:true,albums:[{name:"Álbum",rows}]};
}

function normalizeAlbums(data){
  const rawAlbums = Array.isArray(data?.albums) ? data.albums : Array.isArray(data) ? data : [];
  const src=rawAlbums.filter(a=>Array.isArray(a.rows)||Array.isArray(a.photos)||Array.isArray(a.data));
  return src.map((sheet,idx)=>{
    const albumName=sheet.name||sheet.album||sheet.title||`Álbum ${idx+1}`;
    const albumId=norm(albumName)||`album_${idx+1}`;
    const rawRows=sheet.rows||sheet.photos||sheet.data||[];
    const metaRow=rawRows[0]||{};
    const archived=Boolean(
      sheet.hidden||sheet.isHidden||sheet.archived||sheet.oculto||sheet.hiddenByUser||
      yes(pick(metaRow,["archivado","archived","oculto","hidden","hoja oculta","sheet hidden"]))
    );
    const photos=rawRows
      .map((row,i)=>{
        const rawUrl=findAnyImageUrl(row);
        const url=toImgUrl(rawUrl,420);
        const fullUrl=toImgUrl(rawUrl,1600);
        if(!url)return null;
        const values=Object.values(row||{}).map(v=>String(v||"").trim());
        const name=pick(row,["nombre de foto","nombre_foto","nombre foto","nombre","name","titulo","title","archivo","filename","foto","jugador","player"])||values[1]||`Foto ${i+1}`;
        return {
          id:`${albumId}_${i+1}`,
          albumId,
          albumName,
          index:i,
          name,
          code:safeCode(name+"_"+(i+1)),
          url,
          rawUrl,
          fullUrl,
          price: priceNum(pick(row,["precio foto","precio_foto","precio individual","precio","valor","valor foto","foto precio"]))||2000,
          isCover:yes(pick(row,["portada","cover","caratula"])),
          active:!["no","false","0","ocultar","hide"].includes(norm(pick(row,["activa","active","visible","publicar"])))
        };
      })
      .filter(Boolean)
      .filter(p=>p.active);
    const fullPrice=priceNum(pick(metaRow,["album completo","album_completo","precio_album","precio album","precio completo","fullprice","precio"]))||DEFAULT_FULL_ALBUM_PRICE;
    const coverPhoto=photos.find(p=>p.isCover)||photos[0]||null;
    const dateTs=getAlbumDateFromRows(rawRows);
    return {id:albumId,name:albumName,photos,cover:coverPhoto?coverPhoto.url:"",fullPrice,dateTs,dateLabel:formatAlbumDate(dateTs),archived};
  }).filter(a=>a.photos.length>0);
}

function readFileAsDataURL(file,maxW=1200,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let {width,height}=img;
        if(width>height&&width>maxW){height=Math.round(height*(maxW/width));width=maxW}
        else if(height>maxW){width=Math.round(width*(maxW/height));height=maxW}
        canvas.width=width;canvas.height=height;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('No se pudo leer la imagen'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('No se pudo abrir el archivo'));
    reader.readAsDataURL(file);
  })
}

function buildMatchCover({title,subtitle,homeLogo,awayLogo}){
  return new Promise((resolve,reject)=>{
    const canvas=document.createElement('canvas');
    canvas.width=1080;canvas.height=1350;
    const ctx=canvas.getContext('2d');
    const load=(src)=>new Promise((res,rej)=>{if(!src)return res(null);const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('No se pudo cargar un escudo'));img.src=src;});
    Promise.all([load(homeLogo),load(awayLogo)]).then(([home,away])=>{
      const grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);grad.addColorStop(0,'#0b0d16');grad.addColorStop(.45,'#121933');grad.addColorStop(1,'#050505');ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(60,60,canvas.width-120,canvas.height-120);
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;ctx.strokeRect(60,60,canvas.width-120,canvas.height-120);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 68px Arial';wrapText(ctx,title||'Partido',canvas.width/2,170,canvas.width-220,82);
      if(subtitle){ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='500 32px Arial';wrapText(ctx,subtitle,canvas.width/2,270,canvas.width-260,42)}
      ctx.fillStyle='rgba(255,255,255,0.08)';ctx.beginPath();ctx.roundRect(110,360,860,560,36);ctx.fill();
      if(home){drawContain(ctx,home,145,425,310,310)}
      if(away){drawContain(ctx,away,625,425,310,310)}
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='900 82px Arial';ctx.fillText('VS',canvas.width/2,620);
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='700 28px Arial';ctx.fillText(BRAND,canvas.width/2,1085);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='500 24px Arial';ctx.fillText('Carátula generada desde el panel admin',canvas.width/2,1130);
      resolve(canvas.toDataURL('image/jpeg',0.88));
    }).catch(reject);
  })
}
function drawContain(ctx,img,x,y,w,h){const ratio=Math.min(w/img.width,h/img.height);const nw=img.width*ratio;const nh=img.height*ratio;const nx=x+(w-nw)/2;const ny=y+(h-nh)/2;ctx.drawImage(img,nx,ny,nw,nh)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=String(text||'').split(' ');let line='';let lines=[];for(const word of words){const test=line?line+' '+word:word; if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else{line=test}}if(line)lines.push(line);lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));}

function Steps(){
  const steps=[
    ['1','Elegí las fotos','Recorré la galería y marcá las que más te gusten.'],
    ['2','Realizá la transferencia','Enviala al WhatsApp correspondiente.'],
    ['3','Recibí tus fotos','Alta calidad y sin marca de agua.']
  ];
  const [step,setStep]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setStep(s=>(s+1)%steps.length),2800);return()=>clearInterval(t)},[]);
  return <div className="mb-3 sm:mb-5">
    <div className="sm:hidden bg-neutral-900/90 border border-neutral-800 rounded-xl px-3 py-2.5 overflow-hidden shadow-[0_8px_25px_rgba(0,0,0,.25)]">
      <div className="flex items-center gap-2.5 min-h-[42px] transition-all duration-500" key={step}>
        <div className="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-300 flex items-center justify-center font-black text-xs shrink-0">{steps[step][0]}</div>
        <div className="min-w-0 flex-1">
          <h3 className="font-bold text-[12px] leading-tight text-white">{steps[step][1]}</h3>
          <p className="text-[10px] text-neutral-400 leading-tight mt-0.5">{steps[step][2]}</p>
        </div>
      </div>
      <div className="flex justify-center gap-1.5 mt-2">{steps.map((_,i)=><button key={i} onClick={()=>setStep(i)} className={`h-1.5 rounded-full transition-all ${i===step?'w-5 bg-indigo-400':'w-1.5 bg-neutral-600'}`}></button>)}</div>
    </div>
    <div className="hidden sm:grid grid-cols-3 gap-2.5">{steps.map((s,i)=><div key={i} className="bg-neutral-900/85 border border-neutral-800 rounded-xl px-3 py-3 transition-all duration-300 hover:-translate-y-0.5 hover:border-indigo-400/40 hover:shadow-[0_12px_30px_rgba(79,70,229,.12)]"><div className="flex items-start gap-3"><div className="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-300 flex items-center justify-center font-black text-xs shrink-0">{s[0]}</div><div className="min-w-0"><h3 className="font-bold text-sm leading-tight mb-0.5">{s[1]}</h3><p className="text-[11px] text-neutral-400 leading-snug">{s[2]}</p></div></div></div>)}</div>
  </div>
}

    {editor?.type==='matchCover' && <Modal onClose={()=>setEditor(null)} max="max-w-3xl">
      <h2 className="text-2xl font-black mb-2">Crear portada de partido</h2>
      <p className="text-neutral-400 text-sm mb-5">Subí los dos escudos y escribí el título del partido para generar una carátula.</p>

        </div>

                <button onClick={()=>setTheme(t=>t==='dark'?'light':'dark')} className="w-full sm:w-auto justify-center bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 px-4 py-2.5 rounded-lg text-sm font-bold inline-flex items-center"><i className={`fas ${theme==='dark'?'fa-sun':'fa-moon'} mr-2`}></i>{theme==='dark'?'Claro':'Oscuro'}</button>
                
              </div>
            </div>
            <div className="hidden sm:flex gap-8 mb-4">
              <div><b>{activeAlbums.length}</b> <span className="text-neutral-300">álbumes</span></div>
              <div><b>{allPhotos.length}</b> <span className="text-neutral-300">fotos</span></div>
              <div><b>HD</b> <span className="text-neutral-300">entrega final</span></div>
            </div>
            <div>
              <p className="font-bold">Lucas Abraham | Fotografía deportiva</p>
              <p className="text-neutral-300 text-sm leading-relaxed mt-1"><span className="font-semibold text-white">{HANDLE}</span><br/>Galería privada para elegir y comprar tus fotos favoritas.</p>
            </div>

        </div>
        <div className="sm:hidden grid grid-cols-3 border-y border-neutral-900 mt-5 py-3 text-center">

          <div><b className="block">{allPhotos.length}</b><span className="text-xs text-neutral-500">fotos</span></div>
          <div><b className="block">HD</b><span className="text-xs text-neutral-500">entrega</span></div>
        </div>
        {highlightedAlbums.length>0&&<div className="mt-5 sm:mt-7">

              {highlightedAlbums.map(a=><button key={a.id} onClick={()=>{location.hash=albumHash(a.id)}} className="group shrink-0 w-[74px] sm:w-[88px] text-center transition-all duration-300 hover:-translate-y-1">

              </button>)}

        </div>}
      </header>

      <Steps/>
      <div className="mb-4"><ProtectionNotice/></div>

      {!currentAlbum ? <>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">

          </div>
        </div>}
      </> : <>
        <button onClick={()=>{location.hash="#/galeria";setActiveAlbum(null)}} className="inline-flex items-center gap-2 bg-neutral-900/90 border border-neutral-800 hover:border-neutral-700 px-4 py-2.5 rounded-full mb-4 text-sm font-semibold shadow-[0_8px_22px_rgba(0,0,0,.2)]"><i className="fas fa-arrow-left text-xs"></i>Volver</button>
        <div className="bg-gradient-to-br from-emerald-500/12 via-neutral-900/95 to-black border border-emerald-400/25 rounded-2xl p-3 sm:p-4 mb-4 shadow-[0_14px_34px_rgba(16,185,129,.10)]">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div className="min-w-0">
              <h3 className="text-lg sm:text-xl font-black text-white leading-tight">Colección completa</h3>
              <p className="text-neutral-400 text-xs sm:text-sm leading-relaxed">Todas las fotos del álbum en alta calidad y sin marca de agua.</p>

            <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">

                <p className="text-2xl font-black text-white leading-none">{formatPrice(currentAlbum.fullPrice)}</p>
              </div>
              <button onClick={()=>{const msg=encodeURIComponent(`📸 *COMPRA COLECCIÓN COMPLETA*

Hola Lucas! Quiero comprar TODAS las fotos del evento "${currentAlbum.name}".
💰 *TOTAL: ${formatPrice(currentAlbum.fullPrice)}*

*ALIAS PARA TRANSFERENCIA:*
👉 *${MP_ALIAS}*

Te envío el comprobante para que puedas prepararlas.`);window.open(`https://wa.me/${SELLER_PHONE}?text=${msg}`,'_blank')}} className="w-full sm:w-auto shrink-0 bg-emerald-500 hover:bg-emerald-400 text-black px-4 sm:px-5 py-3 rounded-xl font-black text-sm transition-all flex items-center justify-center gap-2 shadow-[0_10px_25px_rgba(16,185,129,.18)]">
                <i className="fab fa-whatsapp text-base"></i> Comprar
              </button>
            </div>
          </div>

          <div className="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h3 className="font-black">{focusPhoto.name}</h3><p className="text-xs text-neutral-400">Código {focusPhoto.code} · {formatPrice(focusPhoto.price)}</p></div><button onClick={()=>toggle(focusPhoto.id)} className={`${cart.includes(focusPhoto.id)?'bg-indigo-600 text-white':'bg-emerald-500 text-black'} w-full sm:w-auto px-4 py-3 rounded-xl font-black text-sm`}>{cart.includes(focusPhoto.id)?'Agregada al carrito':'Agregar al carrito'}</button></div>
        </div>}
        <div className={`${viewMode==='large'?'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4':'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-2 sm:gap-3'} pb-20`}>
          {albumPhotos.map(photo=>{const isSelected=cart.includes(photo.id);const isFocus=focusPhoto?.id===photo.id;return <div key={photo.id} className={`contain-strict relative rounded-xl overflow-hidden ${viewMode==='large'?'aspect-[4/5]':'aspect-[4/5]'} cursor-pointer transition-all duration-300 ${isSelected?'ring-2 ring-indigo-500 scale-[0.97] shadow-[0_0_30px_rgba(99,102,241,0.2)]':isFocus&&viewMode==='gallery'?'ring-2 ring-emerald-400 bg-neutral-900':'hover:opacity-90 bg-neutral-900 border border-neutral-800'}`}>
            <button onClick={()=>viewMode==='gallery'?setFocusPhoto(photo):setViewer(photo)} className="absolute inset-0 z-10" aria-label="Ver foto"></button>

            <div className={`absolute inset-0 ${isSelected?'bg-indigo-900/40':'bg-transparent'} pointer-events-none`}></div>
            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-2 pt-6 pointer-events-none"><p className="text-white/80 font-mono text-[9px] sm:text-[10px] truncate">{photo.name}</p><p className="text-emerald-300 text-[9px] font-bold">{formatPrice(photo.price)}</p></div>
            <button onClick={(e)=>{e.stopPropagation();toggle(photo.id)}} className={`absolute top-2 right-2 sm:top-3 sm:right-3 w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300 z-20 ${isSelected?'bg-indigo-500 text-white scale-110 shadow-lg':'bg-black/50 text-white/60 border border-white/20 backdrop-blur-sm'}`}><i className={`fas ${isSelected?'fa-check':'fa-plus'} text-sm`}></i></button>
          </div>})}
        </div>
        <PromoBanners/>
      </>}
    </div>

    {viewer && <Modal onClose={()=>setViewer(null)} max="max-w-6xl"><div className="grid lg:grid-cols-[1.2fr,.8fr] gap-5 items-start"><div onTouchStart={e=>touchStartX.current=e.touches?.[0]?.clientX} onTouchEnd={handleSwipeEnd(moveViewer)} className="rounded-3xl overflow-hidden bg-black border border-neutral-800 relative"><img src={viewer.fullUrl||viewer.url} loading="eager" decoding="async" className="w-full max-h-[80vh] object-contain mx-auto"/><PreviewWatermark {...wmProps(viewer.albumId)}/><button onClick={()=>moveViewer(-1)} className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 border border-white/20 text-white"><i className="fas fa-chevron-left"></i></button><button onClick={()=>moveViewer(1)} className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/60 border border-white/20 text-white"><i className="fas fa-chevron-right"></i></button></div><div><h3 className="text-2xl font-black mb-1">{viewer.name}</h3><p className="text-neutral-400 text-sm mb-2">Código {viewer.code} · {viewer.albumName}</p><p className="text-emerald-300 font-black text-xl mb-4">{formatPrice(viewer.price)}</p><div className="bg-neutral-950 border border-neutral-800 rounded-2xl p-4 mb-4"><p className="text-sm text-neutral-300">La foto comprada se entrega en alta calidad y sin marca de agua.</p></div><button onClick={()=>toggle(viewer.id)} className={`w-full ${cart.includes(viewer.id)?'bg-indigo-600':'bg-white text-black'} font-black py-4 rounded-xl mb-3`}>{cart.includes(viewer.id)?'Quitar del carrito':'Agregar al carrito'}</button><button onClick={()=>setViewer(null)} className="w-full bg-neutral-800 py-4 rounded-xl font-bold">Cerrar</button></div></div></Modal>}

    {cart.length>0 && <div className="fixed bottom-4 sm:bottom-6 inset-x-0 mx-auto w-[calc(100vw-24px)] sm:w-[calc(100%-32px)] max-w-2xl z-40 up"><div className="glass border border-white/10 rounded-3xl p-3 sm:p-4 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-3"><div className="flex items-center gap-3 w-full sm:w-auto"><div className="bg-indigo-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg">{cart.length}</div><div className="flex-1"><div className="flex items-baseline gap-2"><p className="text-xl sm:text-2xl font-bold text-white">{formatPrice(total)}</p>{savings>0&&<p className="text-sm text-neutral-500 line-through">{formatPrice(regular)}</p>}</div><p className="text-xs font-medium text-emerald-400">{promoText()}</p>{savings>0&&<p className="text-[10px] text-neutral-400">Ahorrás {formatPrice(savings)}</p>}</div></div><div className="flex gap-2 w-full sm:w-auto"><button onClick={()=>setCart([])} className="px-4 py-3 text-neutral-400 font-medium hover:text-white hover:bg-white/5 rounded-2xl transition text-sm flex-1 sm:flex-none">Vaciar</button><button onClick={sendOrder} className="bg-white hover:bg-neutral-200 text-black px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition flex-1 sm:flex-none">Enviar pedido</button></div></div></div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
