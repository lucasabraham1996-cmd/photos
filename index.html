
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>lucasabraham.ph - Galería de Clientes</title>
    
    <!-- Tailwind CSS para Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Estilos base adicionales */
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0a0a0a; color: white; -webkit-tap-highlight-color: transparent; }
        .glass-effect { background: rgba(23, 23, 23, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* Evitar selección de imágenes para seguridad básica */
        img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
        .prevent-save { -webkit-touch-callout: none; user-select: none; }
        /* Ocultar barra de desplazamiento estéticamente */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
        import { initializeFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, uploadBytesResumable, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js';

        const { useState, useRef, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAznAxOW-leFrKw3tIjRV5vilIjvRKsgk0",
            authDomain: "lucasabraham-b84aa.firebaseapp.com",
            projectId: "lucasabraham-b84aa",
            storageBucket: "lucasabraham-b84aa.firebasestorage.app",
            messagingSenderId: "1057661064112",
            appId: "1:1057661064112:web:6952c87bd6a5388c0e3c75",
            measurementId: "G-NPYNZQ0MPQ"
        };

        let db = null;
        let auth = null;
        let storage = null;
        const appId = 'lucasabraham-ph-db';

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = initializeFirestore(app, { experimentalForceLongPolling: true });
            storage = getStorage(app);
        } catch (error) {
            console.warn("Error inicializando Firebase:", error);
        }

        const calculateBestPrice = (count) => {
            if (count === 0) return 0;
            if (count >= 10) return Math.floor(count / 10) * 10000 + calculateBestPrice(count % 10);
            if (count >= 5) {
                const price = 7500 + calculateBestPrice(count - 5);
                return Math.min(price, 10000); 
            }
            if (count >= 3) {
                const price = 5000 + calculateBestPrice(count - 3);
                return Math.min(price, 7500); 
            }
            const price = count * 2000;
            return Math.min(price, 5000); 
        };

        const formatPrice = (price) => "$" + new Intl.NumberFormat('es-AR').format(price);

        function App() {
            const [route, setRoute] = useState(window.location.hash || '#/galeria');
            const [photos, setPhotos] = useState([]);
            const [albums, setAlbums] = useState([]);
            const [activeAlbum, setActiveAlbum] = useState(null); 
            const [orders, setOrders] = useState([]); 
            
            const [cart, setCart] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [uploadProgress, setUploadProgress] = useState({ current: 0, total: 0 });
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            
            const [sellerPhone, setSellerPhone] = useState('3515580770');
            const [watermarkImg, setWatermarkImg] = useState(null);
            
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newAlbumData, setNewAlbumData] = useState({ name: '', price: '', color: '#171717' });
            const [isLoadingAlbums, setIsLoadingAlbums] = useState(true); 
            
            const [showArchivedModal, setShowArchivedModal] = useState(null);
            const [showCheckoutModal, setShowCheckoutModal] = useState(false);
            const [confirmDialog, setConfirmDialog] = useState(null);

            const fileInputRef = useRef(null);
            const coverInputRef = useRef(null);
            const [adminSelected, setAdminSelected] = useState([]);

            const ADMIN_PIN = '1234'; 
            const MAX_STORAGE_MB = 50; 

            useEffect(() => {
                const handleHashChange = () => setRoute(window.location.hash || '#/galeria');
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => setWatermarkImg(img);
                img.onerror = () => console.warn("No se pudo cargar el logo.");
                img.src = 'https://i.postimg.cc/PrD4jg9V/Logo-LA.png';
            }, []);

            useEffect(() => {
                if (!auth || !db) return;
                signInAnonymously(auth).catch(e => console.warn("Auth mode failed", e));
            }, []);

            useEffect(() => {
                if (!db) {
                    setIsLoadingAlbums(false);
                    return;
                }
                const unsubPhotos = onSnapshot(collection(db, 'artifacts', appId, 'photos'), (snapshot) => {
                    setPhotos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                const unsubAlbums = onSnapshot(collection(db, 'artifacts', appId, 'albums'), (snapshot) => {
                    setAlbums(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setIsLoadingAlbums(false);
                });
                const unsubOrders = onSnapshot(collection(db, 'artifacts', appId, 'orders'), (snapshot) => {
                    setOrders(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubPhotos(); unsubAlbums(); unsubOrders(); };
            }, []);

            const storageUsedMB = useMemo(() => {
                return (photos.length * 0.25).toFixed(2); // Calculo aproximado
            }, [photos]);

            const storagePercentage = Math.min((storageUsedMB / MAX_STORAGE_MB) * 100, 100);

            const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const activeAlbums = albums.filter(a => !a.isArchived && (!a.createdAt || (now - a.createdAt) <= FIVE_DAYS_MS));
            const expiredButNotArchived = albums.filter(a => !a.isArchived && a.createdAt && (now - a.createdAt) > FIVE_DAYS_MS);
            const archivedAlbums = albums.filter(a => a.isArchived || (a.createdAt && (now - a.createdAt) > FIVE_DAYS_MS));

            const handleCreateAlbumSubmit = async (e) => {
                e.preventDefault();
                if (!newAlbumData.name) return;
                const newAlbum = {
                    id: Math.random().toString(36).substr(2, 9),
                    name: newAlbumData.name,
                    fullPrice: Number(newAlbumData.price) || 0,
                    color: newAlbumData.color || '#171717',
                    cover: null,
                    createdAt: Date.now(),
                    isArchived: false
                };
                if (db) await setDoc(doc(db, 'artifacts', appId, 'albums', newAlbum.id), newAlbum);
                setShowCreateModal(false);
                setNewAlbumData({ name: '', price: '', color: '#171717' });
            };

            const processCover = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_DIMENSION = 1000;
                            let width = img.width; let height = img.height;
                            if (width > height && width > MAX_DIMENSION) { height *= MAX_DIMENSION / width; width = MAX_DIMENSION; }
                            else if (height > MAX_DIMENSION) { width *= MAX_DIMENSION / height; height = MAX_DIMENSION; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            canvas.toBlob((blob) => resolve({ blob }), 'image/jpeg', 0.8);
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const handleCoverUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !activeAlbum) return;
                setIsProcessing(true);
                try {
                    const processed = await processCover(file);
                    const fileId = Math.random().toString(36).substr(2, 9);
                    const storageRef = ref(storage, `galeria/${activeAlbum}/cover_${fileId}.jpg`);
                    await uploadBytes(storageRef, processed.blob);
                    const url = await getDownloadURL(storageRef);
                    await setDoc(doc(db, 'artifacts', appId, 'albums', activeAlbum), { 
                        cover: url, 
                        coverStoragePath: storageRef.fullPath 
                    }, { merge: true });
                } catch (error) { console.error("Error subiendo portada:", error); }
                setIsProcessing(false);
                if (coverInputRef.current) coverInputRef.current.value = '';
            };

            // Motor de procesamiento liviano y estable para VISTA PREVIA
            // Sube copias muy comprimidas, con marca de agua, para no llenar Storage ni trabar el navegador.
            const PREVIEW_MAX_DIMENSION = 520;
            const PREVIEW_JPEG_QUALITY = 0.22;
            const IMAGE_PROCESS_TIMEOUT_MS = 20000;
            const UPLOAD_TIMEOUT_MS = 45000;

            const fileToObjectUrl = (file) => URL.createObjectURL(file);

            const canvasToBlobSafe = (canvas, quality = PREVIEW_JPEG_QUALITY) => {
                return new Promise((resolve) => {
                    try {
                        canvas.toBlob((blob) => resolve(blob || null), 'image/jpeg', quality);
                    } catch (error) {
                        console.warn('No se pudo convertir la imagen a JPG:', error);
                        resolve(null);
                    }
                });
            };

            const drawTextWatermark = (ctx, width, height) => {
                ctx.save();
                ctx.globalAlpha = 0.42;
                ctx.translate(width / 2, height / 2);
                ctx.rotate(-Math.PI / 6);
                ctx.translate(-width / 2, -height / 2);

                const fontSize = Math.max(18, Math.round(width * 0.065));
                ctx.font = `700 ${fontSize}px Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.72)';
                ctx.strokeStyle = 'rgba(0,0,0,0.45)';
                ctx.lineWidth = Math.max(2, Math.round(fontSize * 0.10));

                const mark = 'lucasabraham.ph';
                const stepX = width * 0.62;
                const stepY = height * 0.22;

                for (let x = -width; x <= width * 2; x += stepX) {
                    for (let y = -height; y <= height * 2; y += stepY) {
                        ctx.strokeText(mark, x, y);
                        ctx.fillText(mark, x, y);
                    }
                }
                ctx.restore();
            };

            const processImage = (file, albumId) => {
                return new Promise((resolve) => {
                    let finished = false;
                    let objectUrl = null;

                    const done = (value) => {
                        if (finished) return;
                        finished = true;
                        if (objectUrl) URL.revokeObjectURL(objectUrl);
                        resolve(value);
                    };

                    const timeout = setTimeout(() => {
                        console.warn('La imagen tardó demasiado en procesarse y se omitió:', file?.name);
                        done(null);
                    }, IMAGE_PROCESS_TIMEOUT_MS);

                    (async () => {
                        try {
                            if (!file || !file.type || !file.type.startsWith('image/')) {
                                clearTimeout(timeout);
                                return done(null);
                            }

                            objectUrl = fileToObjectUrl(file);
                            const img = new Image();
                            img.onload = async () => {
                                try {
                                    const originalWidth = img.naturalWidth || img.width;
                                    const originalHeight = img.naturalHeight || img.height;
                                    if (!originalWidth || !originalHeight) {
                                        clearTimeout(timeout);
                                        return done(null);
                                    }

                                    let width = originalWidth;
                                    let height = originalHeight;

                                    if (width >= height && width > PREVIEW_MAX_DIMENSION) {
                                        height = Math.round(height * (PREVIEW_MAX_DIMENSION / width));
                                        width = PREVIEW_MAX_DIMENSION;
                                    } else if (height > PREVIEW_MAX_DIMENSION) {
                                        width = Math.round(width * (PREVIEW_MAX_DIMENSION / height));
                                        height = PREVIEW_MAX_DIMENSION;
                                    }

                                    const canvas = document.createElement('canvas');
                                    canvas.width = Math.max(1, width);
                                    canvas.height = Math.max(1, height);

                                    const ctx = canvas.getContext('2d', { alpha: false });
                                    ctx.fillStyle = '#111111';
                                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                    drawTextWatermark(ctx, canvas.width, canvas.height);

                                    const blob = await canvasToBlobSafe(canvas, PREVIEW_JPEG_QUALITY);
                                    clearTimeout(timeout);

                                    if (!blob) return done(null);
                                    done({
                                        albumId,
                                        name: file.name.replace(/\.[^/.]+$/, '') + '_preview.jpg',
                                        blob,
                                        size: blob.size,
                                        timestamp: Date.now()
                                    });
                                } catch (err) {
                                    clearTimeout(timeout);
                                    console.error('Fallo procesando imagen:', err);
                                    done(null);
                                }
                            };
                            img.onerror = () => {
                                clearTimeout(timeout);
                                console.warn('No se pudo leer la imagen:', file?.name);
                                done(null);
                            };
                            img.src = objectUrl;
                        } catch (err) {
                            clearTimeout(timeout);
                            console.error('Fallo general procesando imagen:', err);
                            done(null);
                        }
                    })();
                });
            };

            const uploadBlobWithTimeout = (storageRef, blob) => {
                return new Promise((resolve, reject) => {
                    const uploadTask = uploadBytesResumable(storageRef, blob, {
                        contentType: 'image/jpeg',
                        cacheControl: 'public,max-age=31536000'
                    });

                    const timeout = setTimeout(() => {
                        try { uploadTask.cancel(); } catch (e) {}
                        reject(new Error('La subida tardó demasiado y fue cancelada.'));
                    }, UPLOAD_TIMEOUT_MS);

                    uploadTask.on('state_changed',
                        null,
                        (error) => {
                            clearTimeout(timeout);
                            reject(error);
                        },
                        async () => {
                            clearTimeout(timeout);
                            resolve(uploadTask.snapshot);
                        }
                    );
                });
            };

            const handleFileUpload = async (e) => {
                if (!activeAlbum) return;
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setIsProcessing(true);
                setUploadProgress({ current: 1, total: files.length });

                try {
                    if (db && storage) {
                        const photosCol = collection(db, 'artifacts', appId, 'photos');
                        let firstCoverUrl = null;

                        let skipped = 0;
                        for (let i = 0; i < files.length; i++) {
                            const file = files[i];
                            setUploadProgress({ current: i + 1, total: files.length });
                            
                            const photo = await processImage(file, activeAlbum);
                            if (!photo) { skipped++; continue; } // Si dio error esa foto, saltar a la siguiente sin congelar.

                            const fileId = Math.random().toString(36).substr(2, 9);
                            const storageRef = ref(storage, `galeria/${activeAlbum}/${fileId}.jpg`);
                            
                            await uploadBlobWithTimeout(storageRef, photo.blob);
                            const downloadUrl = await getDownloadURL(storageRef);
                            
                            if (!firstCoverUrl) firstCoverUrl = downloadUrl;

                            await addDoc(photosCol, {
                                albumId: photo.albumId,
                                name: photo.name,
                                url: downloadUrl,
                                storagePath: storageRef.fullPath,
                                timestamp: photo.timestamp
                            });
                        }
                    
                        if (skipped > 0) {
                            console.warn(`${skipped} foto(s) se omitieron porque no pudieron procesarse o subirse.`);
                            alert(`${skipped} foto(s) no pudieron subirse. Las demás quedaron cargadas correctamente.`);
                        }

                        const currentAlbum = albums.find(a => a.id === activeAlbum);
                        if (currentAlbum && !currentAlbum.cover && firstCoverUrl) {
                            await setDoc(doc(db, 'artifacts', appId, 'albums', activeAlbum), { cover: firstCoverUrl }, { merge: true });
                        }
                    }
                } catch (error) {
                    console.error("Error subiendo:", error);
                    alert("Se produjo un error de red al subir algunas imágenes, intenta de nuevo.");
                } finally {
                    setIsProcessing(false);
                    setUploadProgress({ current: 0, total: 0 });
                    if (fileInputRef.current) fileInputRef.current.value = '';
                }
            };

            const removePhoto = async (id, storagePath, albumId) => {
                if (!db) return;
                await deleteDoc(doc(db, 'artifacts', appId, 'photos', id));
                const album = albums.find(a => a.id === albumId);
                if (storagePath && storage && album?.coverStoragePath !== storagePath) {
                    try { await deleteObject(ref(storage, storagePath)); } catch(e) {}
                }
                setCart(cart.filter(itemId => itemId !== id));
            };

            const setPhotoAsCover = async (photo) => {
                if (!db || !activeAlbum) return;
                setIsProcessing(true);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'albums', activeAlbum), { 
                        cover: photo.url, 
                        coverStoragePath: photo.storagePath 
                    }, { merge: true });
                } catch (e) { console.error(e); }
                setIsProcessing(false);
            };

            const executeArchiveAlbum = async (albumId) => {
                setIsProcessing(true);
                setConfirmDialog(null);
                const albumData = albums.find(a => a.id === albumId);
                const coverPath = albumData?.coverStoragePath;
                const albumPhotos = photos.filter(p => p.albumId === albumId);
                
                for (const p of albumPhotos) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'photos', p.id));
                    if (p.storagePath && storage && p.storagePath !== coverPath) {
                        try { await deleteObject(ref(storage, p.storagePath)); } catch(e) {}
                    }
                }
                await setDoc(doc(db, 'artifacts', appId, 'albums', albumId), { isArchived: true }, { merge: true });
                setIsProcessing(false);
                setActiveAlbum(null);
            };

            const executeDeleteAlbum = async (albumId) => {
                setIsProcessing(true);
                setConfirmDialog(null);
                const albumData = albums.find(a => a.id === albumId);
                const coverPath = albumData?.coverStoragePath;
                const albumPhotos = photos.filter(p => p.albumId === albumId);
                
                for (const p of albumPhotos) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'photos', p.id));
                    if (p.storagePath && storage) {
                        try { await deleteObject(ref(storage, p.storagePath)); } catch(e) {}
                    }
                }
                
                if (coverPath && storage) {
                    try { await deleteObject(ref(storage, coverPath)); } catch(e) {}
                }

                await deleteDoc(doc(db, 'artifacts', appId, 'albums', albumId));
                setIsProcessing(false);
                setActiveAlbum(null);
            };

            const toggleCart = (id) => setCart(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            const toggleAdminSelect = (id) => setAdminSelected(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            
            const handleSelectAllAdmin = () => {
                const albumPhotos = photos.filter(p => p.albumId === activeAlbum);
                if (adminSelected.length === albumPhotos.length) setAdminSelected([]);
                else setAdminSelected(albumPhotos.map(p => p.id));
            };

            const handleBulkDelete = async () => {
                if (adminSelected.length === 0) return;
                setConfirmDialog({
                    title: 'Eliminar Seleccionadas',
                    text: `¿Seguro que deseas eliminar ${adminSelected.length} fotos permanentemente?`,
                    onConfirm: async () => {
                        setIsProcessing(true);
                        setConfirmDialog(null);
                        for (const id of adminSelected) {
                            const photo = photos.find(p => p.id === id);
                            if (photo) await removePhoto(photo.id, photo.storagePath, photo.albumId);
                        }
                        setAdminSelected([]);
                        setIsProcessing(false);
                    }
                });
            };

            const toggleOrderStatus = async (orderId, currentStatus) => {
                if (db) {
                    await setDoc(doc(db, 'artifacts', appId, 'orders', orderId), { processed: !currentStatus }, { merge: true });
                }
            };

            const currentPrice = useMemo(() => calculateBestPrice(cart.length), [cart.length]);
            const regularPrice = cart.length * 2000;
            const savings = regularPrice - currentPrice;
            const currentOrderId = useMemo(() => 'LA-' + Math.floor(10000 + Math.random() * 90000), [cart.length]);

            const handleCheckoutFinal = async () => {
                const selectedPhotos = photos.filter(p => cart.includes(p.id));
                const newOrder = {
                    id: currentOrderId, date: new Date().toISOString(), total: currentPrice,
                    items: selectedPhotos.map(p => ({ id: p.id, originalName: p.name }))
                };

                if (db) await setDoc(doc(db, 'artifacts', appId, 'orders', currentOrderId), newOrder);

                let message = `📸 *NUEVO PEDIDO DE FOTOS*\n\nHola Lucas! Te adjunto el comprobante de pago.\n\n`;
                message += `📋 *OPERACIÓN:* #${currentOrderId}\n`;
                message += `💰 *TOTAL PAGADO:* ${formatPrice(currentPrice)}\n`;
                message += `_Cantidad de fotos: ${cart.length}_\n\n`;
                message += `*FOTOS ELEGIDAS:*\n`;
                selectedPhotos.forEach(p => message += `▫️ ${p.id.slice(-6).toUpperCase()}\n`);

                window.open(`https://wa.me/${sellerPhone}?text=${encodeURIComponent(message)}`, '_blank');
                
                setCart([]); 
                setShowCheckoutModal(false);
            };

            const ConfirmModal = () => {
                if (!confirmDialog) return null;
                return (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] flex items-center justify-center p-4 fade-in">
                        <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl slide-up">
                            <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/30">
                                <i className="fas fa-exclamation-triangle text-2xl text-red-400"></i>
                            </div>
                            <h3 className="text-xl text-white font-medium mb-2">{confirmDialog.title}</h3>
                            <p className="text-neutral-400 text-sm mb-6 leading-relaxed">{confirmDialog.text}</p>
                            <div className="flex gap-3">
                                <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-neutral-800 hover:bg-neutral-700 text-white font-medium py-3 rounded-xl transition">
                                    Cancelar
                                </button>
                                <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium py-3 rounded-xl transition">
                                    Confirmar
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const CheckoutModalComponent = () => {
                if (!showCheckoutModal) return null;
                return (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[60] flex items-center justify-center p-4 fade-in">
                        <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl w-full max-w-md shadow-2xl slide-up relative overflow-hidden">
                            <button onClick={() => setShowCheckoutModal(false)} className="absolute top-4 right-4 text-neutral-500 hover:text-white transition bg-neutral-800 rounded-full w-8 h-8 flex items-center justify-center">
                                <i className="fas fa-times"></i>
                            </button>

                                            Contactar
                                        </button>
                                        <button onClick={() => { navigator.clipboard.writeText('lucasabraham.mp'); setCopySuccess(true); setTimeout(()=>setCopySuccess(false), 2000); }} className="bg-[#009EE3]/10 hover:bg-[#009EE3]/20 text-[#009EE3] text-sm font-bold px-4 py-2 rounded-xl transition w-full sm:w-auto text-center border border-[#009EE3]/30 flex items-center justify-center gap-2">
                                            <i className="fas fa-handshake"></i> Alias MP
                                        </button>
                                    </div>
                                </div>

                                <div className="hidden sm:flex gap-8 mb-4">
                                    <div className="text-white"><span className="font-bold">{albums.length}</span> álbumes</div>
                                    <div className="text-white"><span className="font-bold">{photos.length}</span> fotos publicadas</div>
                                </div>

                                <div className="hidden sm:block">
                                    <p className="font-semibold text-white mb-1">Lucas Abraham | Fotografía</p>
                                    <p className="text-neutral-300 text-sm leading-relaxed">
                                        Galería privada para clientes. Selecciona tus favoritas.<br/>
                                        💎 Packs Promo: 3x$5k | 5x$7.5k | 10x$10k
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Bio & Stats */}
                        <div className="sm:hidden mb-6">
                            <p className="font-semibold text-white mb-1">Lucas Abraham | Fotografía</p>
                            <p className="text-neutral-300 text-sm leading-relaxed mb-4">
                                Galería privada para clientes. Selecciona tus favoritas.<br/>
                                💎 Packs Promo: 3x$5k | 5x$7.5k | 10x$10k
                            </p>
                            <div className="flex justify-around border-t border-neutral-900 pt-4">
                                <div className="text-center flex flex-col">
                                    <span className="font-bold text-white text-lg">{albums.length}</span>
                                    <span className="text-xs text-neutral-500">álbumes</span>
                                </div>
                                <div className="text-center flex flex-col">
                                    <span className="font-bold text-white text-lg">{photos.length}</span>
                                    <span className="text-xs text-neutral-500">fotos</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Tab Navigation */}
                    <div className="max-w-4xl mx-auto flex justify-center border-t border-neutral-900 mb-6">
                        <div className="flex items-center gap-2 border-t-2 border-white pt-3 pb-2 px-4 -mt-[1px]">
                            <i className="fas fa-th text-xs"></i>
                            <span className="text-[11px] font-semibold text-white uppercase tracking-widest">Galería</span>
                        </div>
                    </div>

                    <div className="max-w-[1400px] mx-auto px-4 md:px-8 mt-4">
                        {isLoadingAlbums ? (
                            <div className="flex flex-col items-center justify-center py-32 fade-in">
                                <svg className="w-12 h-12 animate-spin mb-4" viewBox="0 0 50 50">
                                    <defs>
                                        <linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                                            <stop offset="0%" stopColor="#f59e0b" />
                                            <stop offset="50%" stopColor="#ec4899" />
                                            <stop offset="100%" stopColor="#6366f1" />
                                        </linearGradient>
                                    </defs>
                                    <circle cx="25" cy="25" r="20" fill="none" stroke="url(#ig-grad)" strokeWidth="4" strokeDasharray="80 150" strokeLinecap="round" />
                                </svg>
                                <p className="text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-pink-500 to-indigo-500 font-bold text-sm animate-pulse tracking-wide uppercase">Cargando...</p>
                            </div>
                        ) : activeAlbum === null ? (
                            <div>
                                {/* Modal Álbum Archivado */}
                                {showArchivedModal && (
                                    <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 fade-in">
                                        <div className="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl w-full max-w-md text-center shadow-2xl slide-up">
                                            <div className="w-16 h-16 bg-neutral-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-neutral-700">
                                                <i className="fas fa-lock text-2xl text-neutral-400"></i>
                                            </div>
                                            <h3 className="text-xl text-white font-medium mb-2">Galería Archivada</h3>
                                            <p className="text-neutral-400 text-sm mb-6 leading-relaxed">
                                                Este evento ha expirado de la nube pública. Comunícate para solicitar acceso a los archivos.
                                            </p>
                                            <div className="flex flex-col gap-3">
                                                <button onClick={() => {
                                                    const msg = encodeURIComponent(`Hola Lucas! Quería consultar por las fotos de la galería archivada "${showArchivedModal.name}".`);
                                                    window.open(`https://wa.me/${sellerPhone}?text=${msg}`, '_blank');
                                                    setShowArchivedModal(null);
                                                }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl transition flex items-center justify-center gap-2">
                                                    <i className="fab fa-whatsapp text-lg"></i> Contactar por WhatsApp
                                                </button>
                                                <button onClick={() => setShowArchivedModal(null)} className="w-full bg-neutral-800 hover:bg-neutral-700 text-white font-medium py-4 rounded-xl transition">
                                                    Volver a Galerías
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* Álbumes Activos */}
                                <div className="mb-12">
                                    <div className="flex flex-col mb-6 border-b border-neutral-900 pb-3">
                                        <h2 className="text-2xl text-white font-bold tracking-tight flex items-center gap-2"><i className="fas fa-bolt text-emerald-400"></i> Eventos Activos</h2>
                                        <p className="text-neutral-500 text-sm mt-1">Fotos en alta calidad. Disponibles por tiempo limitado.</p>
                                    </div>
                                    {activeAlbums.length === 0 ? (
                                        <p className="text-neutral-500 text-sm text-center py-10">No hay eventos recientes activos.</p>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                                            {activeAlbums.map(album => (
                                                <div key={album.id} onClick={() => setActiveAlbum(album.id)} className="group cursor-pointer">
                                                    <div className="aspect-[4/5] rounded-3xl overflow-hidden bg-neutral-900 border border-neutral-800 mb-3 relative shadow-lg group-hover:border-indigo-500/50 transition-all" style={{ backgroundColor: album.color || '#171717' }}>
                                                        {album.cover ? (
                                                            <img src={album.cover} alt="Cover" className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center"><i className="fas fa-camera text-4xl text-white/20"></i></div>
                                                        )}
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                                                        <div className="absolute bottom-5 left-5 right-5">
                                                            <h3 className="text-white font-bold text-xl shadow-sm truncate mb-1">{album.name}</h3>
                                                            {album.createdAt && (
                                                                <p className="text-emerald-400 text-xs font-medium">
                                                                    <i className="fas fa-clock mr-1"></i> Disponible {5 - Math.floor((Date.now() - album.createdAt) / (1000 * 60 * 60 * 24))} días
                                                                </p>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Álbumes Archivados */}
                                {archivedAlbums.length > 0 && (
                                    <div>
                                        <div className="flex flex-col mb-6 border-b border-neutral-900 pb-3 mt-8">
                                            <h2 className="text-xl text-neutral-400 font-bold tracking-tight flex items-center gap-2"><i className="fas fa-archive text-neutral-500"></i> Eventos Archivados</h2>
                                            <p className="text-neutral-600 text-xs mt-1">Archivos originales resguardados por el estudio fotográfico.</p>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 opacity-80">
                                            {archivedAlbums.map(album => (
                                                <div key={album.id} onClick={() => setShowArchivedModal(album)} className="group cursor-pointer hover:opacity-100 transition-all">
                                                    <div className="aspect-[4/5] rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800 mb-2 relative" style={{ backgroundColor: album.color || '#171717' }}>
                                                        {album.cover && (
                                                            <img src={album.cover} alt="Cover" className="w-full h-full object-cover opacity-30 group-hover:opacity-50 transition-all grayscale group-hover:grayscale-0" />
                                                        )}
                                                        <div className="absolute inset-0 flex items-center justify-center">
                                                            <div className="bg-black/80 px-3 py-1.5 rounded-full text-[10px] text-white border border-white/10 flex items-center gap-1 backdrop-blur-sm">
                                                                <i className="fas fa-lock text-neutral-400"></i> Archivado
                                                            </div>
                                                        </div>
                                                        <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-3 text-center">
                                                            <h3 className="text-white/80 font-medium text-xs truncate">{album.name}</h3>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="fade-in">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                                    <button onClick={() => setActiveAlbum(null)} className="flex items-center gap-2 text-neutral-400 hover:text-white transition bg-neutral-900 px-5 py-3 rounded-full border border-neutral-800 text-sm font-medium">
                                        <i className="fas fa-arrow-left"></i> Volver a Galerías
                                    </button>
                                </div>
                                
                                {/* Botón de Comprar Álbum Completo - Diseño VIP Mejorado */}
                                {activeAlbumData?.fullPrice > 0 && (
                                    <div className="relative bg-gradient-to-br from-neutral-900 to-black border border-white/10 rounded-[2rem] p-6 md:p-8 mb-10 overflow-hidden group shadow-2xl">
                                        {/* Background glow elements */}
                                        <div className="absolute top-0 right-0 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
                                        <div className="absolute bottom-0 left-0 w-64 h-64 bg-amber-500/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/3 pointer-events-none"></div>
                                        
                                        <div className="relative z-10 flex flex-col lg:flex-row items-center justify-between gap-8">
                                            <div className="flex-1 text-center lg:text-left">
                                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-[10px] font-bold tracking-widest uppercase mb-4">
                                                    <i className="fas fa-star"></i> Opción Premium
                                                </div>
                                                <h3 className="text-3xl font-extrabold text-white mb-3 tracking-tight">
                                                    Colección Completa
                                                </h3>
                                                <p className="text-neutral-400 text-sm md:text-base mb-6 max-w-xl mx-auto lg:mx-0">
                                                    Desbloquea <strong>todas las fotos</strong> del evento "{activeAlbumData.name}" en máxima resolución, sin marcas de agua y listas para imprimir.
                                                </p>
                                                
                                                <div className="flex flex-col sm:flex-row items-center gap-4 bg-white/5 border border-white/10 rounded-2xl p-4 backdrop-blur-sm w-fit mx-auto lg:mx-0">
                                                    <div className="w-10 h-10 rounded-full bg-amber-500/20 flex items-center justify-center flex-shrink-0">
                                                        <i className="fas fa-clock text-amber-400"></i>
                                                    </div>
                                                    <p className="text-center sm:text-left text-xs text-neutral-300 leading-relaxed">
                                                        Se enviará un link de descarga (Drive/Google Fotos).<br/>
                                                        <strong className="text-amber-400/90">Disponible por 15 días luego del envío.</strong>
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="w-full lg:w-auto flex flex-col items-center gap-4 bg-black/40 p-6 rounded-3xl border border-white/5">
                                                <div className="text-center">
                                                    <p className="text-[10px] text-neutral-500 uppercase tracking-widest mb-1 font-semibold">Valor Total</p>
                                                    <p className="text-4xl font-black text-white">{formatPrice(activeAlbumData.fullPrice)}</p>
                                                </div>
                                                <button onClick={() => {
                                                    const msg = encodeURIComponent(`📸 *COMPRA COLECCIÓN COMPLETA*\n\nHola Lucas! Quiero comprar TODAS las fotos del evento "${activeAlbumData.name}".\n💰 *TOTAL: ${formatPrice(activeAlbumData.fullPrice)}*\n\n✅ Entiendo que el link de descarga tendrá una duración de 15 días.\n\nPor favor, indícame cómo realizar el pago.`);
                                                    window.open(`https://wa.me/${sellerPhone}?text=${msg}`, '_blank');
                                                }} className="w-full sm:w-auto bg-white text-black hover:bg-neutral-200 px-8 py-4 rounded-xl font-bold transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 shadow-[0_0_40px_rgba(255,255,255,0.15)]">
                                                    <i className="fab fa-whatsapp text-xl"></i> Comprar Colección
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                
                                {photos.filter(p => p.albumId === activeAlbum).length === 0 ? (
                                    <p className="text-center text-neutral-500 py-20">Este álbum aún no tiene fotos.</p>
                                ) : (
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2 sm:gap-4 md:gap-6 pb-20 prevent-save" onContextMenu={(e) => e.preventDefault()}>
                                        {photos.filter(p => p.albumId === activeAlbum).map(photo => {
                                            const isSelected = cart.includes(photo.id);
                                            return (
                                                <div key={photo.id} onClick={() => toggleCart(photo.id)} className={`relative rounded-2xl overflow-hidden aspect-[4/5] cursor-pointer transition-all duration-300 select-none ${isSelected ? 'ring-2 ring-indigo-500 scale-[0.94] shadow-[0_0_30px_rgba(99,102,241,0.2)]' : 'hover:opacity-90 bg-neutral-900 border border-neutral-800 active:scale-[0.98]'}`}>
                                                    <img src={photo.url} alt="Foto" className="w-full h-full object-cover pointer-events-none" />
                                                    
                                                    <div className={`absolute inset-0 transition-colors duration-300 ${isSelected ? 'bg-indigo-900/40' : 'bg-transparent'}`}></div>
                                                    
                                                    {/* Nombre de foto */}
                                                    <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-2 pt-6">
                                                        <p className="text-white/70 font-mono text-[9px] sm:text-[10px] truncate">{photo.name}</p>
                                                    </div>

                                                    <div className={`absolute top-2 right-2 sm:top-3 sm:right-3 w-8 h-8 rounded-full flex items-center justify-center transition-all duration-300 z-10 ${isSelected ? 'bg-indigo-500 text-white scale-110 shadow-lg' : 'bg-black/40 text-transparent border border-white/20 backdrop-blur-sm'}`}>
                                                        <i className="fas fa-check text-sm"></i>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Carrito Flotante Mobile/Desktop */}
                    {cart.length > 0 && (
                        <div className="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-20px)] sm:w-[calc(100%-32px)] max-w-2xl z-40 slide-up">
                            <div className="glass-effect border border-white/10 rounded-3xl p-4 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
                                <div className="flex items-center gap-3 w-full sm:w-auto">
                                    <div className="bg-indigo-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/20">{cart.length}</div>
                                    <div className="flex-1">
                                        <div className="flex items-baseline gap-2">
                                            <p className="text-2xl font-bold text-white">{formatPrice(currentPrice)}</p>
                                            {savings > 0 && <p className="text-sm text-neutral-500 line-through">{formatPrice(regularPrice)}</p>}
                                        </div>
                                        {savings > 0 ? <p className="text-xs font-medium text-emerald-400">¡Promo aplicada!</p> : <p className="text-xs text-neutral-400">Selecciona más para descuentos</p>}
                                    </div>
                                </div>
                                <div className="flex gap-2 w-full sm:w-auto">
                                    <button onClick={() => setCart([])} className="px-4 py-3 text-neutral-400 font-medium hover:text-white hover:bg-white/5 rounded-2xl transition text-sm flex-1 sm:flex-none">Vaciar</button>
                                    <button onClick={() => setShowCheckoutModal(true)} className="bg-white hover:bg-neutral-200 text-black px-6 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition flex-1 sm:flex-none">
                                        Pedir Fotos
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {CheckoutModalComponent()}
                </div>
                );
            };

            if (route === '#/admin') {
                return isAdminUnlocked ? AdminDashboard() : AdminLogin();
            }
            return ClientGallery();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
