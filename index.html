<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>lucasabraham.ph - Galería de Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070707;color:#fff;-webkit-tap-highlight-color:transparent}    
    .glass{background:rgba(20,20,20,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .fade{animation:fade .28s ease-out forwards}.up{animation:up .34s cubic-bezier(.16,1,.3,1) forwards}
    @keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    img{-webkit-user-drag:none;user-select:none}.prevent-save{-webkit-touch-callout:none;user-select:none}
    .wmText{position:absolute;inset:-25%;pointer-events:none;opacity:.34;transform:rotate(-28deg);display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:42px 30px;align-content:center;mix-blend-mode:screen}.wmText span{font-size:12px;font-weight:900;letter-spacing:.14em;color:rgba(255,255,255,.62);text-shadow:0 1px 12px rgba(0,0,0,.85);white-space:nowrap}
    .wmLines{position:absolute;inset:-40%;pointer-events:none;opacity:.22;background-image:repeating-linear-gradient(-28deg,transparent 0 92px,rgba(255,255,255,.18) 94px 96px,transparent 98px 170px)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;

/*
  PASO CLAVE:
  Pegá acá la URL de tu Google Apps Script Web App.
  Debe terminar en /exec
  Ejemplo: const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";
*/
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQixATrOYyu-wUnm23Cgy6_zbuUNOjbYQ636fEqHIt4GqzTZxVBJvhwireNt5isFE8lQ/exec";

const FALLBACK_PUBLISHED_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvPPaZazUa43TBu127nq74y-UMDRRMKdQpOCWOWT6cc5YnsRwcTrzGA7NYM-QbYEnFSkMbdkgkaOn8/pub?output=csv";
const BRAND="lucasabraham.ph";
const SELLER_PHONE="3515580770";
const MP_ALIAS="lucasabraham.mp";
const DEFAULT_FULL_ALBUM_PRICE=50000;
const ADMIN_PIN="1234";

const formatPrice=(p)=>"$"+new Intl.NumberFormat("es-AR").format(Number(p||0));
const norm=(v)=>String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
const pick=(row,keys)=>{const map={};Object.keys(row||{}).forEach(k=>map[norm(k)]=row[k]);for(const k of keys){const v=map[norm(k)];if(v!==undefined&&String(v).trim()!=="")return String(v).trim()}return""};
const priceNum=(v)=>Number(String(v||"").replace(/[^0-9]/g,""))||0;
const calculateBestPrice=(count)=>{if(count<=0)return 0;if(count>=10)return Math.floor(count/10)*10000+calculateBestPrice(count%10);if(count>=5)return Math.min(7500+calculateBestPrice(count-5),10000);if(count>=3)return Math.min(5000+calculateBestPrice(count-3),7500);return Math.min(count*2000,5000)};
const extractDriveId=(url)=>{const s=String(url||"");const patterns=[/drive\.google\.com\/file\/d\/([^/]+)/,/drive\.google\.com\/open\?id=([^&]+)/,/drive\.google\.com\/uc\?[^#]*id=([^&]+)/,/[?&]id=([^&]+)/];for(const p of patterns){const m=s.match(p);if(m&&m[1])return decodeURIComponent(m[1])}return""};
const toImgUrl=(url)=>{const raw=String(url||"").trim();if(!raw)return"";const id=extractDriveId(raw);if(id)return`https://drive.google.com/thumbnail?id=${id}&sz=w900`;return raw};

function jsonp(url){return new Promise((resolve,reject)=>{const cb="cb_"+Date.now()+"_"+Math.random().toString(36).slice(2);const sep=url.includes("?")?"&":"?";const script=document.createElement("script");let done=false;const timer=setTimeout(()=>{if(done)return;done=true;delete window[cb];script.remove();reject(new Error("No respondió la fuente de datos"));},15000);window[cb]=(data)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();resolve(data)};script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();reject(new Error("No se pudo cargar la fuente de datos"))};script.src=url+sep+"callback="+encodeURIComponent(cb)+"&v="+Date.now();document.body.appendChild(script)})}

function gvizJsonpForFirstSheet(){return new Promise((resolve,reject)=>{const m=FALLBACK_PUBLISHED_SHEET_URL.match(/\/spreadsheets\/d\/e\/([^/]+)\//);if(!m)return reject(new Error("No se pudo detectar el ID publicado de la planilla"));const cb="gviz_"+Date.now()+"_"+Math.random().toString(36).slice(2);const url=`https://docs.google.com/spreadsheets/d/e/${m[1]}/gviz/tq?tqx=out:json;responseHandler:${cb}&tq=${encodeURIComponent("select *")}&v=${Date.now()}`;const script=document.createElement("script");let done=false;const timer=setTimeout(()=>{if(done)return;done=true;delete window[cb];script.remove();reject(new Error("La planilla publicada no respondió"));},15000);window[cb]=(res)=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();try{const cols=(res.table.cols||[]).map((c,i)=>c.label||`Columna ${i+1}`);const rows=(res.table.rows||[]).map(r=>{const obj={};cols.forEach((h,i)=>obj[h]=(r.c[i]&&r.c[i].v!==undefined)?r.c[i].v:"");return obj});resolve({ok:true,albums:[{name:"Galería",rows}]})}catch(e){reject(e)}};script.onerror=()=>{if(done)return;done=true;clearTimeout(timer);delete window[cb];script.remove();reject(new Error("Google Sheets bloqueó la lectura directa. Usá Apps Script."))};script.src=url;document.body.appendChild(script)})}

function normalizeAlbums(data){
  const rawAlbums=(data&&data.albums)||[];
  return rawAlbums.map((album,idx)=>{
    const albumId="album_"+idx+"_"+norm(album.name);
    const photos=(album.rows||[]).map((row,i)=>{
      const rawUrl=pick(row,["url","url_preview","preview","imagen","imagen_url","foto","link","drive","google_drive","archivo","image"]);
      const url=toImgUrl(rawUrl);
      const active=pick(row,["activa","activo","publicar","visible","estado"]);
      const hidden=["no","false","0","inactiva","inactivo","ocultar","baja"].includes(norm(active));
      const name=pick(row,["nombre","foto_nombre","archivo","jugador","jugadora","dorsal","descripcion","detalle","id"] )||`Foto ${i+1}`;
      const code=pick(row,["codigo","id","nro","numero","foto_id"] )||`${i+1}`;
      const coverFlag=norm(pick(row,["portada","cover","caratula"]));
      const fullAlbumPrice=priceNum(pick(row,["precio_album","album_precio","precio_total","coleccion","precio_coleccion"]));
      return {id:`${albumId}_${i}_${code}`,albumId,albumName:album.name||`Álbum ${idx+1}`,name,code,url,rawUrl,isCover:["si","true","1","portada","cover"].includes(coverFlag),fullAlbumPrice,active:!!url&&!hidden,row};
    }).filter(p=>p.active);
    const coverPhoto=photos.find(p=>p.isCover)||photos[0];
    const fullPrice=(photos.find(p=>p.fullAlbumPrice>0)||{}).fullAlbumPrice||DEFAULT_FULL_ALBUM_PRICE;
    return {id:albumId,name:album.name||`Álbum ${idx+1}`,photos,cover:coverPhoto?coverPhoto.url:"",fullPrice};
  }).filter(a=>a.photos.length>0);
}

function Watermark(){return <><div className="wmLines"></div><div className="wmText">{Array.from({length:18}).map((_,i)=><span key={i}>PREVIEW · {BRAND}</span>)}</div></>}
function Steps(){return <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8"><div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl"><b>1. Elegí</b><p className="text-xs text-neutral-400 mt-1">Seleccioná tus fotos favoritas.</p></div><div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl"><b>2. Pagá</b><p className="text-xs text-neutral-400 mt-1">Transferí por Mercado Pago.</p></div><div className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl"><b>3. Recibí</b><p className="text-xs text-neutral-400 mt-1">Te envío las finales sin marca de agua.</p></div></div>}
function App(){
  const [route,setRoute]=useState(location.hash||"#/galeria");const [albums,setAlbums]=useState([]);const [activeAlbum,setActiveAlbum]=useState(null);const [cart,setCart]=useState([]);const [loading,setLoading]=useState(true);const [error,setError]=useState("");const [pin,setPin]=useState("");const [admin,setAdmin]=useState(false);const [viewer,setViewer]=useState(null);const [copyOk,setCopyOk]=useState(false);
  useEffect(()=>{const h=()=>setRoute(location.hash||"#/galeria");addEventListener("hashchange",h);return()=>removeEventListener("hashchange",h)},[]);
  async function load(){setLoading(true);setError("");try{let data;if(APPS_SCRIPT_URL.trim()){data=await jsonp(APPS_SCRIPT_URL.trim())}else{data=await gvizJsonpForFirstSheet()}const normalized=normalizeAlbums(data);if(!normalized.length)throw new Error("La planilla cargó, pero no encontré fotos. Revisá que haya columna URL o Imagen y links públicos.");setAlbums(normalized)}catch(e){console.error(e);setError(e.message||"No se pudo cargar la galería")}finally{setLoading(false)}}
  useEffect(()=>{load()},[]);
  const allPhotos=useMemo(()=>albums.flatMap(a=>a.photos),[albums]);const currentAlbum=albums.find(a=>a.id===activeAlbum);const albumPhotos=currentAlbum?currentAlbum.photos:[];const selectedPhotos=allPhotos.filter(p=>cart.includes(p.id));const total=calculateBestPrice(cart.length);const regular=cart.length*2000;const savings=regular-total;
  const promoText=()=>{const n=cart.length;if(n===0)return"Seleccioná tus fotos favoritas";if(n<3)return`Sumá ${3-n} foto${3-n===1?"":"s"} más y accedé al pack de 3 por $5.000`;if(n===3)return"Pack aplicado: 3 fotos por $5.000";if(n<5)return`Sumá ${5-n} foto más y accedé al pack de 5 por $7.500`;if(n===5)return"Pack aplicado: 5 fotos por $7.500";if(n<10)return`Sumá ${10-n} fotos y accedé al pack de 10 por $10.000`;return"Pack aplicado: 10 fotos por $10.000"};
  const toggle=(id)=>setCart(c=>c.includes(id)?c.filter(x=>x!==id):[...c,id]);
  const sendOrder=()=>{const order="LA-"+Math.floor(10000+Math.random()*90000);let msg=`📸 *NUEVO PEDIDO DE FOTOS*\n\nHola Lucas! Quiero comprar estas fotos en alta calidad, sin marca de agua.\n\n📋 *OPERACIÓN:* #${order}\n💰 *TOTAL:* ${formatPrice(total)}\n🖼️ *Cantidad:* ${cart.length} fotos\n\n*FOTOS ELEGIDAS:*\n`;selectedPhotos.forEach(p=>msg+=`▫️ ${p.albumName} - ${p.name} - Código ${p.code}\n`);msg+=`\nTe envío el comprobante para que puedas prepararlas.`;window.open(`https://wa.me/${SELLER_PHONE}?text=${encodeURIComponent(msg)}`,"_blank");setCart([])};
  if(loading)return <div className="min-h-screen flex items-center justify-center"><div className="text-center"><div className="w-12 h-12 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p className="text-indigo-300 font-semibold">Cargando galería...</p></div></div>;
  if(error)return <div className="min-h-screen flex items-center justify-center p-5"><div className="max-w-xl w-full bg-neutral-900 border border-red-500/40 rounded-3xl p-7"><div className="w-14 h-14 rounded-2xl bg-red-500/20 border border-red-400/30 flex items-center justify-center mb-5"><i className="fas fa-triangle-exclamation text-red-300 text-2xl"></i></div><h1 className="text-2xl font-black mb-4">No se pudo cargar la galería</h1><div className="bg-black border border-neutral-800 rounded-2xl p-4 text-red-200 text-sm mb-5">{error}</div><p className="text-sm text-neutral-300 leading-relaxed mb-4">Si todavía no pegaste la URL de Apps Script en el HTML, la app solo podrá intentar leer la primera hoja publicada. Para usar cada pestaña como álbum, configurá Apps Script.</p><button onClick={load} className="w-full bg-white text-black font-bold py-4 rounded-xl">Reintentar</button></div></div>;
  if(route==="#/admin"&&!admin)return <div className="min-h-screen flex items-center justify-center p-4"><form onSubmit={e=>{e.preventDefault();pin===ADMIN_PIN?setAdmin(true):alert("PIN incorrecto")}} className="bg-neutral-900 border border-neutral-800 p-7 rounded-3xl w-full max-w-sm"><h1 className="text-2xl font-bold mb-2">Acceso admin</h1><p className="text-neutral-400 text-sm mb-5">Panel de control de la galería.</p><input value={pin} onChange={e=>setPin(e.target.value)} type="password" placeholder="PIN" className="w-full bg-black border border-neutral-700 rounded-xl p-4 mb-4 text-center text-xl tracking-widest outline-none"/><button className="w-full bg-indigo-600 py-4 rounded-xl font-bold">Entrar</button></form></div>;
  if(route==="#/admin")return <div className="min-h-screen p-5 md:p-8 max-w-6xl mx-auto"><header className="flex flex-col sm:flex-row gap-3 sm:items-end sm:justify-between border-b border-neutral-800 pb-5 mb-6"><div><h1 className="text-3xl font-black">Panel {BRAND}</h1><p className="text-neutral-400 text-sm">Datos cargados desde Google Sheets. {APPS_SCRIPT_URL?"Modo Apps Script":"Modo fallback: primera hoja solamente"}.</p></div><button onClick={()=>location.hash="#/galeria"} className="bg-neutral-800 px-4 py-3 rounded-xl">Ver galería</button></header><div className="grid md:grid-cols-3 gap-4 mb-6"><div className="bg-neutral-900 p-5 rounded-2xl border border-neutral-800"><b>{albums.length}</b><p className="text-xs text-neutral-400">álbumes</p></div><div className="bg-neutral-900 p-5 rounded-2xl border border-neutral-800"><b>{allPhotos.length}</b><p className="text-xs text-neutral-400">fotos publicadas</p></div><div className="bg-neutral-900 p-5 rounded-2xl border border-neutral-800"><b>{cart.length}</b><p className="text-xs text-neutral-400">fotos en carrito actual</p></div></div><div className="grid md:grid-cols-3 gap-4">{albums.map(a=><div key={a.id} className="bg-neutral-900 border border-neutral-800 rounded-3xl overflow-hidden"><div className="h-44 bg-neutral-950 relative">{a.cover&&<img src={a.cover} className="w-full h-full object-cover"/>}</div><div className="p-4"><h3 className="font-bold truncate">{a.name}</h3><p className="text-xs text-neutral-400">{a.photos.length} fotos · Álbum completo {formatPrice(a.fullPrice)}</p></div></div>)}</div></div>;
  return <div className="min-h-screen pb-36 prevent-save" onContextMenu={e=>e.preventDefault()}><div className="max-w-6xl mx-auto px-4 py-8"><header className="flex gap-5 items-center mb-7"><div className="w-20 h-20 sm:w-28 sm:h-28 rounded-full p-[3px] bg-gradient-to-tr from-yellow-500 via-pink-500 to-indigo-500 shrink-0"><div className="w-full h-full rounded-full bg-neutral-950 border-4 border-neutral-950 flex items-center justify-center overflow-hidden"><img src="https://i.postimg.cc/PrD4jg9V/Logo-LA.png" className="w-[72%] h-[72%] object-contain"/></div></div><div className="flex-1"><h1 className="text-2xl sm:text-4xl font-black">{BRAND}</h1><p className="text-neutral-300 text-sm sm:text-base mt-1">Reviví los mejores momentos del evento y elegí tus fotos favoritas en alta calidad.</p><p className="text-amber-300 text-xs sm:text-sm mt-2">Las imágenes publicadas son previews en baja resolución con marca de agua. Las finales se entregan sin marca de agua.</p><div className="flex gap-2 mt-4"><button onClick={()=>window.open(`https://wa.me/${SELLER_PHONE}`,"_blank")} className="bg-neutral-800 border border-neutral-700 px-4 py-2 rounded-xl text-sm font-bold">Contactar</button><button onClick={()=>{navigator.clipboard.writeText(MP_ALIAS);setCopyOk(true);setTimeout(()=>setCopyOk(false),1800)}} className="bg-[#009EE3]/15 border border-[#009EE3]/30 text-[#4fc3f7] px-4 py-2 rounded-xl text-sm font-bold">{copyOk?"Alias copiado":"Alias MP"}</button></div></div></header><Steps/>{!currentAlbum?<><h2 className="text-2xl font-black mb-4">Eventos disponibles</h2><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">{albums.map(a=><div key={a.id} onClick={()=>setActiveAlbum(a.id)} className="cursor-pointer group"><div className="aspect-[4/5] rounded-3xl overflow-hidden bg-neutral-900 border border-neutral-800 relative"><img src={a.cover} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition duration-700"/><div className="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div><div className="absolute bottom-5 left-5 right-5"><h3 className="text-xl font-black truncate">{a.name}</h3><p className="text-emerald-300 text-sm">{a.photos.length} fotos disponibles</p></div></div></div>)}</div></>:<><button onClick={()=>setActiveAlbum(null)} className="bg-neutral-900 border border-neutral-800 px-5 py-3 rounded-full mb-6"><i className="fas fa-arrow-left mr-2"></i>Volver</button><div className="bg-gradient-to-br from-neutral-900 to-black border border-white/10 rounded-[2rem] p-6 mb-7"><div className="flex flex-col lg:flex-row lg:items-center justify-between gap-5"><div><p className="text-amber-300 text-xs font-black uppercase tracking-widest mb-2"><i className="fas fa-star mr-1"></i> Opción premium</p><h2 className="text-3xl font-black mb-2">{currentAlbum.name}</h2><p className="text-neutral-400 max-w-xl">Comprá la colección completa en alta calidad, sin marcas de agua y lista para descargar.</p></div><div className="bg-black/40 border border-white/10 rounded-3xl p-5 text-center"><p className="text-xs text-neutral-500 uppercase">Valor colección</p><p className="text-3xl font-black mb-3">{formatPrice(currentAlbum.fullPrice)}</p><button onClick={()=>{const msg=`📸 *COMPRA COLECCIÓN COMPLETA*\n\nHola Lucas! Quiero comprar TODAS las fotos del evento "${currentAlbum.name}" en alta calidad y sin marca de agua.\n💰 Total: ${formatPrice(currentAlbum.fullPrice)}`;window.open(`https://wa.me/${SELLER_PHONE}?text=${encodeURIComponent(msg)}`,"_blank")}} className="bg-white text-black px-6 py-3 rounded-xl font-black"><i className="fab fa-whatsapp mr-2"></i>Comprar colección</button></div></div></div><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5">{albumPhotos.map(p=>{const selected=cart.includes(p.id);return <div key={p.id} onClick={()=>setViewer(p)} className={`relative rounded-2xl overflow-hidden aspect-[4/5] cursor-pointer bg-neutral-900 border transition ${selected?"border-indigo-500 ring-2 ring-indigo-500 scale-[.96]":"border-neutral-800"}`}><img src={p.url} className="w-full h-full object-cover"/><Watermark/><div className={`absolute inset-0 ${selected?"bg-indigo-900/35":""}`}></div><button onClick={e=>{e.stopPropagation();toggle(p.id)}} className={`absolute top-2 right-2 w-8 h-8 rounded-full flex items-center justify-center z-20 ${selected?"bg-indigo-500 text-white":"bg-black/55 border border-white/20 text-white"}`}><i className="fas fa-check text-xs"></i></button><div className="absolute bottom-0 left-0 right-0 p-2 pt-8 bg-gradient-to-t from-black/95 to-transparent"><p className="text-[10px] text-white/75 truncate">{p.name}</p></div></div>})}</div></>}</div>{viewer&&<div className="fixed inset-0 bg-black/90 z-50 p-4 flex items-center justify-center fade" onClick={()=>setViewer(null)}><div className="w-full max-w-4xl up" onClick={e=>e.stopPropagation()}><div className="relative rounded-3xl overflow-hidden bg-neutral-950 border border-neutral-800"><img src={viewer.url} className="w-full max-h-[76vh] object-contain"/><Watermark/><button onClick={()=>setViewer(null)} className="absolute top-4 right-4 bg-black/70 w-10 h-10 rounded-full"><i className="fas fa-times"></i></button></div><div className="flex flex-col sm:flex-row gap-3 justify-between items-center mt-4 glass border border-white/10 rounded-2xl p-4"><div><h3 className="font-bold">{viewer.name}</h3><p className="text-xs text-neutral-400">Preview protegida · entrega final sin marca de agua</p></div><button onClick={()=>toggle(viewer.id)} className="bg-white text-black px-6 py-3 rounded-xl font-black w-full sm:w-auto">{cart.includes(viewer.id)?"Quitar selección":"Seleccionar foto"}</button></div></div></div>}{cart.length>0&&<div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-24px)] max-w-2xl z-40 up"><div className="glass border border-white/10 rounded-3xl p-4 flex flex-col sm:flex-row gap-3 sm:items-center justify-between"><div className="flex items-center gap-3"><div className="bg-indigo-500 w-12 h-12 rounded-2xl flex items-center justify-center font-black text-xl">{cart.length}</div><div><div className="flex gap-2 items-baseline"><p className="text-2xl font-black">{formatPrice(total)}</p>{savings>0&&<p className="line-through text-neutral-500 text-sm">{formatPrice(regular)}</p>}</div><p className="text-xs text-emerald-300">{promoText()}</p></div></div><div className="flex gap-2"><button onClick={()=>setCart([])} className="px-4 py-3 rounded-2xl text-neutral-300">Vaciar</button><button onClick={sendOrder} className="bg-white text-black px-5 py-3 rounded-2xl font-black">Solicitar en alta calidad</button></div></div></div>}</div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
